// Used by gradleBuild.sh when CI saves and restores the gradle build cache.
// Each run restores the cache saved by an earlier run, adds its own entries and
// saves it again, so it grows until entries are old enough for gradle to remove.
// The default of 7 days lets it grow to hundreds of MB more than a build needs,
// which makes it slower to restore and save. Gradle removes old entries at most
// once a day.
beforeSettings { settings ->
    settings.caches {
        buildCache.setRemoveUnusedEntriesAfterDays(1)
    }
}
