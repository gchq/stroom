proxyConfig:
  contentDir: "content"
  dirScanner:
    dirs:
    - "zip_file_ingest"
    enabled: true
    failureDir: "zip_file_ingest_failed"
    scanFrequency: "PT1M"
  downstreamHost:
    apiKey: null
    apiKeyVerificationUrl: null
    enabled: true
    hostname: null
    maxCachedKeyAge: "PT10M"
    maxPersistedKeyAge: "P30D"
    noFetchIntervalAfterFailure: "PT30S"
    pathPrefix: null
    persistedKeysHashAlgorithm: "SHA2_512"
    port: null
    scheme: "https"
  durability: "FULL"
  eventStore:
    maxAge: "PT1M"
    maxByteCount: 9223372036854775807
    maxEventCount: 9223372036854775807
    rollFrequency: "PT10S"
  feedStatus:
    feedStatusCache:
      expireAfterAccess: null
      expireAfterWrite: null
      maximumSize: 1000
      refreshAfterWrite: null
      statisticsMode: "DROPWIZARD_METRICS"
    url: null
  forwardFileDestinations:
  - atomicMoveEnabled: true
    enabled: true
    failureDestination: null
    instant: false
    livenessCheckMode: "READ"
    livenessCheckPath: null
    name: null
    path: null
    retry:
      livenessCheckInterval: "PT1M"
      maxRetryAge: "P7D"
      maxRetryDelay: "PT1H"
      retryDelay: "PT10M"
      retryDelayGrowthFactor: 1.0
    subPathTemplate:
      enabled: true
      pathTemplate: "${year}${month}${day}/${feed}"
      templatingMode: "REPLACE_UNKNOWN_PARAMS"
    threads:
      consumerThreads: 5
  forwardHttpDestinations:
  - addOpenIdAccessToken: false
    apiKey: null
    enabled: true
    failureDestination: null
    forwardHeadersAdditionalAllowSet: []
    forwardUrl: null
    httpClient:
      connectionRequestTimeout: "PT3M"
      connectionTimeout: "PT3M"
      cookiesEnabled: false
      followRedirects: true
      keepAlive: "PT0S"
      maxConnections: 1024
      maxConnectionsPerRoute: 1024
      proxy: null
      retries: 0
      timeToLive: "PT1H"
      timeout: "PT3M"
      tls: null
      userAgent: null
      validateAfterInactivityPeriod: "PT0S"
    instant: false
    livenessCheckEnabled: true
    livenessCheckUrl: null
    name: null
    retry:
      livenessCheckInterval: "PT1M"
      maxRetryAge: "P7D"
      maxRetryDelay: "PT1H"
      retryDelay: "PT10M"
      retryDelayGrowthFactor: 1.0
    threads:
      consumerThreads: 5
  forwardS3Destinations: []
  logStream:
    metaKeys:
    - "GUID"
    - "ReceiptId"
    - "Feed"
    - "Type"
    - "System"
    - "Environment"
    - "RemoteHost"
    - "RemoteAddress"
    - "RemoteDN"
    - "RemoteCertExpiry"
    - "DataReceiptRule"
    useMappedDiagnosticContext: false
  path:
    data: "data"
    home: null
    temp: null
  pipeline:
    fileStores:
      aggregateStore:
        accessKeyId: null
        bucket: null
        credentialsType: null
        durability: null
        endpointOverride: null
        keyPrefix: null
        localCachePath: null
        orphanAge: null
        path: null
        region: null
        secretAccessKey: null
        type: "LOCAL_FILESYSTEM"
      receiveStore:
        accessKeyId: null
        bucket: null
        credentialsType: null
        durability: null
        endpointOverride: null
        keyPrefix: null
        localCachePath: null
        orphanAge: null
        path: null
        region: null
        secretAccessKey: null
        type: "LOCAL_FILESYSTEM"
      splitStore:
        accessKeyId: null
        bucket: null
        credentialsType: null
        durability: null
        endpointOverride: null
        keyPrefix: null
        localCachePath: null
        orphanAge: null
        path: null
        region: null
        secretAccessKey: null
        type: "LOCAL_FILESYSTEM"
    mode: "LOCAL"
    queues:
      aggregateInput:
        bootstrapServers: null
        consumer: {}
        maxDeliveryAttempts: 100
        path: null
        producer: {}
        queueUrl: null
        topic: null
        type: "LOCAL_FILESYSTEM"
        visibilityTimeout: null
        waitTime: null
      forwardingInput:
        bootstrapServers: null
        consumer: {}
        maxDeliveryAttempts: 100
        path: null
        producer: {}
        queueUrl: null
        topic: null
        type: "LOCAL_FILESYSTEM"
        visibilityTimeout: null
        waitTime: null
      splitZipInput:
        bootstrapServers: null
        consumer: {}
        maxDeliveryAttempts: 100
        path: null
        producer: {}
        queueUrl: null
        topic: null
        type: "LOCAL_FILESYSTEM"
        visibilityTimeout: null
        waitTime: null
    stages:
      aggregate:
        aggregationFrequency: "PT10M"
        enabled: true
        fileStore: "aggregateStore"
        inputQueue: "aggregateInput"
        maxItemsPerAggregate: 1000
        maxUncompressedByteSize: "1.0G"
        outputQueue: "forwardingInput"
        threads:
          consumerThreads: 1
          mergeThreads: 1
      forward:
        enabled: true
        inputQueue: "forwardingInput"
        threads:
          consumerThreads: 1
      receive:
        enabled: true
        fileStore: "receiveStore"
        outputQueue: "aggregateInput"
        splitZipQueue: "splitZipInput"
      splitZip:
        enabled: true
        fileStore: "splitStore"
        inputQueue: "splitZipInput"
        outputQueue: "aggregateInput"
        threads:
          consumerThreads: 1
  proxyId: null
  receiptPolicy:
    receiveDataRulesUrl: null
    syncFrequency: "PT1M"
  receive:
    allowedCertificateProviders: []
    authenticatedDataFeedKeyCache:
      expireAfterAccess: null
      expireAfterWrite: "PT5M"
      maximumSize: 1000
      refreshAfterWrite: null
      statisticsMode: "DROPWIZARD_METRICS"
    authenticationRequired: true
    dataFeedIdentitiesDir: "data_feed_identities"
    dataFeedOwnerMetaKey: "AccountId"
    enabledAuthenticationTypes:
    - "TOKEN"
    - "CERTIFICATE"
    fallbackReceiveAction: "RECEIVE"
    feedNameGenerationEnabled: false
    feedNameGenerationMandatoryHeaders:
    - "AccountId"
    - "Component"
    - "Format"
    - "Schema"
    feedNameTemplate: "${accountid}-${component}-${format}-${schema}"
    maxRequestSize: null
    metaTypes:
    - "Context"
    - "Detections"
    - "Error"
    - "Events"
    - "Meta Data"
    - "Raw Events"
    - "Raw Reference"
    - "Records"
    - "Reference"
    - "Test Events"
    - "Test Reference"
    receiptCheckMode: "FEED_STATUS"
    s3Event:
      rePollDuration: "PT5M"
      sqs: null
    x509CertificateDnFormat: "LDAP"
    x509CertificateDnHeader: "X-SSL-CLIENT-S-DN"
    x509CertificateHeader: "X-SSL-CERT"
  security:
    authentication:
      authenticationRequired: true
      openId:
        allowedAudiences: []
        audienceClaimRequired: true
        authEndpoint: null
        authenticationRequestExtraParams: {}
        clientCredentialsScopes:
        - "openid"
        clientId: null
        clientSecret: null
        expectedSignerPrefixes: []
        formTokenRequest: true
        fullNameClaimTemplate: "${name}"
        identityProviderType: "NO_IDP"
        issuer: null
        jwksUri: null
        logoutEndpoint: null
        logoutRedirectParamName: "post_logout_redirect_uri"
        openIdConfigurationEndpoint: null
        publicKeyUriPattern: "https://public-keys.auth.elb.${awsRegion}.amazonaws.com/${keyId}"
        requestScopes:
        - "openid"
        - "email"
        requiredAccessTokenType: null
        tokenEndpoint: null
        uniqueIdentityClaim: "sub"
        userDisplayNameClaim: "preferred_username"
        validIssuers: []
        validateAudience: true
  sqsConnectors:
  - awsRegionName: null
    pollFrequency: "PT10S"
    queueUrl: null
