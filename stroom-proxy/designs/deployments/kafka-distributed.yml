# Deployment: Distributed with Kafka queues and a shared filesystem
#
# Use case: on-premise distributed pipeline where Kafka is already the messaging
# backbone and a shared filesystem (NFS, PVC, SAN) is available to all nodes.
#
# Same constraint as SQS: Kafka carries references only, so the file stores must
# be visible to every producer and consumer. Here that is an explicit shared
# mount rather than S3, which is why each store is SHARED_FILESYSTEM with a
# `path` on the mount (required; a shared store without one is refused) -
# shared-mount visibility is your responsibility to arrange.
#
# LocalFileStore partitions committed groups by a per-instance writerId, so
# several proxy nodes writing the same shared store never collide on a path.
# That is what makes a shared mount safe here whereas a shared *local queue*
# directory would not be — see infrastructure/queues.md §2.6.

proxyConfig:

  # Required: receiptCheckMode defaults to FEED_STATUS, which admits data only if the
  # downstream says so - so the proxy must know where the downstream is. Without a hostname the
  # check cannot run, and before 2026-09-02 it silently answered "receive" for every feed. It is
  # now a validation error, so a proxy configured to check receipts but not told where to check
  # refuses to start.
  #
  # Set receiptCheckMode: RECEIVE_ALL (or downstreamHost.enabled: false) if this proxy is not
  # meant to consult a downstream at all.
  downstreamHost:
    enabled: true
    hostname: "stroom.example.com"

  pipeline:
    mode: SHARED
    queues:
      splitZipInput:
        type: KAFKA
        topic: "stroom-proxy-split-zip-input"
        bootstrapServers: "kafka-1.example.com:9092,kafka-2.example.com:9092"
        consumer:
          group.id: "stroom-proxy-split-zip"
          auto.offset.reset: "earliest"
        producer:
          compression.type: "lz4"
      aggregateInput:
        type: KAFKA
        topic: "stroom-proxy-aggregate-input"
        bootstrapServers: "kafka-1.example.com:9092,kafka-2.example.com:9092"
        consumer:
          group.id: "stroom-proxy-aggregate"
          # The proxy defaults partition.assignment.strategy to CooperativeStickyAssignor, so a
          # node joining does not revoke - and so redeliver - every input of every open aggregate
          # on every node. Leave it unless you know why.
        producer:
          compression.type: "lz4"
      forwardingInput:
        type: KAFKA
        topic: "stroom-proxy-forwarding-input"
        bootstrapServers: "kafka-1.example.com:9092,kafka-2.example.com:9092"
        consumer:
          group.id: "stroom-proxy-forwarding"
        producer:
          compression.type: "lz4"

    fileStores:
      receiveStore:
        type: SHARED_FILESYSTEM
        orphanAge: P14D
        path: "/mnt/proxy-shared/file-stores/receiveStore"
      splitStore:
        type: SHARED_FILESYSTEM
        orphanAge: P14D
        path: "/mnt/proxy-shared/file-stores/splitStore"
      aggregateStore:
        type: SHARED_FILESYSTEM
        orphanAge: P14D
        path: "/mnt/proxy-shared/file-stores/aggregateStore"

    stages:
      receive:
        enabled: true
        fileStore: receiveStore
        outputQueue: aggregateInput
        splitZipQueue: splitZipInput
      splitZip:
        enabled: true
        inputQueue: splitZipInput
        outputQueue: aggregateInput
        fileStore: splitStore
        threads:
          consumerThreads: 4
      # An open aggregate is the set of records this node holds uncommitted on aggregateInput.
      # The record key is the feed, so every input of a feed reaches one consumer, and each
      # claimer thread is a consumer with its own partitions: this is the backend that gives one
      # aggregate per feed across a cluster. The offset is committed only up to the first record
      # still held, so a node that dies mid-aggregate loses nothing.
      aggregate:
        enabled: true
        inputQueue: aggregateInput
        outputQueue: forwardingInput
        fileStore: aggregateStore
        maxItemsPerAggregate: 1000
        maxUncompressedByteSize: "1G"
        aggregationFrequency: "PT10M"
        threads:
          consumerThreads: 4   # claimers, each a Kafka consumer with its own partitions
          mergeThreads: 4      # merge workers close what the claimers fill
      forward:
        enabled: true
        inputQueue: forwardingInput
        threads:
          consumerThreads: 8

  forwardHttpDestinations:
    - name: "downstream-stroom"
      enabled: true
      forwardUrl: "https://stroom.example.com/stroom/datafeed"
      # In SHARED mode the give-up destination must be shared: here a directory at least two
      # levels below a SHARED_FILESYSTEM store's path, where the store's age sweep never looks.
      # An S3 bucket is the alternative. A node-local directory is refused at start-up.
      failureDestination:
        type: "FILE"
        path: "/mnt/proxy-shared/file-stores/aggregateStore/give-up/downstream-stroom"

# Kafka notes
#
# These properties are RESERVED - the proxy sets them and configuration that
# tries to override them is rejected at startup:
#   consumer: max.poll.records, enable.auto.commit, key/value.deserializer
#   producer: acks, key/value.serializer
# Each one breaks the queue invisibly if changed, so it fails loudly instead.
# Record key is the aggregation key (feed and type) when the message carries one, so every
# part of a feed lands on one partition and one aggregating node; the messageId otherwise.
# Give-up publishes to <topic>.failed, which the proxy creates at start-up.
#
# Everything else under `consumer:`/`producer:` is yours to tune - group.id,
# auto.offset.reset, security.protocol, sasl.*, ssl.*, fetch.*, session and poll
# timeouts, compression, and so on. group.id defaults to
# "stroom-proxy-<queueName>"; override it — as above — when you want the group
# name to be explicit, or when two pipelines share a cluster.
#
# Each consumer thread gets its own Kafka consumer in the shared group, so
# partition count per topic sets the ceiling on useful consumerThreads for that
# stage across the whole deployment: extra consumers in a group beyond the
# partition count are assigned nothing and sit idle. The thread counts below
# assume each topic has at least that many partitions.
#
# fail() republishes the record to the tail of the topic with its attempt count
# and commits past the original, so a failed message goes behind the ones
# waiting rather than being retried at once. After maxDeliveryAttempts the
# proxy publishes it to <topic>.failed instead, which is where a human acts.
