name: VPN concentrator (JSON lines, message layout varies by kind)
template: Event Data (JSON)
capabilities: [field_variability, schema_variation, escaping]
request: >
  Onboard the VPN concentrators' logs (JSON lines). Each line has the host, time and severity, and a message whose
  layout depends on its first word: AUTH ok or fail (user, source address, then the method on success or the reason
  on failure, sometimes more), SESSION end (user, duration), and TUNNEL up or down (peer address and tunnel name),
  which analysts treat as alerts. Values with spaces are quoted. Anything else is free text: keep it as an event
  too, with the text. Index the events.
expected:
  records: 8
  event_types: [Authenticate, Alert]
  paths: [EventTime/TimeCreated, EventSource/Device/HostName, EventDetail/TypeId]
  values:
    EventSource/User/Id: [Jane Doe, jsmith, svc backup]
    EventSource/Client/IPAddress: [198.51.100.7, 203.0.113.9, 198.51.100.23]
sample: |
  {"host": "vpn01", "time": "2026-10-02T07:58:01Z", "severity": "info", "message": "AUTH ok user=\"Jane Doe\" src=198.51.100.7 method=radius"}
  {"host": "vpn01", "time": "2026-10-02T07:59:12Z", "severity": "warning", "message": "AUTH fail user=jsmith src=203.0.113.9 reason=\"bad password\""}
  {"host": "vpn01", "time": "2026-10-02T08:00:03Z", "severity": "info", "message": "AUTH ok user=jsmith src=203.0.113.9 method=local"}
  {"host": "vpn02", "time": "2026-10-02T08:05:40Z", "severity": "notice", "message": "TUNNEL down peer=192.0.2.50 name=branch-02"}
  {"host": "vpn02", "time": "2026-10-02T08:06:10Z", "severity": "notice", "message": "TUNNEL up peer=192.0.2.50 name=branch-02"}
  {"host": "vpn01", "time": "2026-10-02T08:30:44Z", "severity": "info", "message": "SESSION end user=\"Jane Doe\" duration=1963s"}
  {"host": "vpn01", "time": "2026-10-02T08:31:00Z", "severity": "info", "message": "Heartbeat from monitoring probe 3"}
  {"host": "vpn01", "time": "2026-10-02T09:12:27Z", "severity": "warning", "message": "AUTH fail user=\"svc backup\" src=198.51.100.23 reason=\"account locked\" attempts=5"}
reference:
  mapping:
    input: json
    json_layout: lines
    extract:
      - {field: message, regex: '^(\S+) (\S+)', names: [kind, verb]}
      - {field: message, regex: ' user=(?:"([^"]*)"|(\S+))', names: [user_quoted, user_plain]}
      - {field: message, regex: ' src=(\S+)', names: [src]}
      - {field: message, regex: ' method=(\S+)', names: [method]}
      - {field: message, regex: ' reason="([^"]*)"', names: [reason]}
      - {field: message, regex: ' duration=(\d+)s', names: [duration]}
      - {field: message, regex: ' peer=(\S+)', names: [peer]}
      - {field: message, regex: ' name=(\S+)', names: [tunnel]}
    common:
      - {path: EventTime/TimeCreated, field: time, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
      - {path: EventSource/System/Name, value: Remote Access VPN}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: vpn}
      - {path: EventSource/Device/HostName, field: host}
      - {path: EventDetail/TypeId, field: kind}
      - {path: EventDetail/Description, field: message}
    events:
      - name: auth
        when: [{field: kind, equals: AUTH}]
        fields:
          - {path: EventSource/User/Id, any_of: [user_quoted, user_plain]}
          - {path: EventSource/Client/IPAddress, field: src}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, any_of: [user_quoted, user_plain]}
          - {path: EventDetail/Authenticate/Outcome/Success, field: verb, map: {ok: "true", fail: "false"}}
          - {path: EventDetail/Authenticate/Outcome/Description, field: reason}
          - {path: EventDetail/Authenticate/Data, data_name: method, field: method}
      - name: session end
        when: [{field: kind, equals: SESSION}]
        fields:
          - {path: EventSource/User/Id, any_of: [user_quoted, user_plain]}
          - {path: EventDetail/Authenticate/Action, value: Logoff}
          - {path: EventDetail/Authenticate/User/Id, any_of: [user_quoted, user_plain]}
          - {path: EventDetail/Authenticate/Data, data_name: duration_seconds, field: duration}
      - name: tunnel
        when: [{field: kind, equals: TUNNEL}]
        fields:
          - {path: EventDetail/Alert/Type, value: Network}
          - {path: EventDetail/Alert/Severity, field: verb, map: {down: Major, up: Info}}
          - {path: EventDetail/Alert/Network/Source/Device/HostName, field: host}
          - {path: EventDetail/Alert/Network/Destination/Device/IPAddress, field: peer}
          - {path: EventDetail/Alert/Data, data_name: tunnel, field: tunnel}
      - name: other
        # The request: anything else is free text, kept as an event with the text.
        allow_unknown: free text with no recognised layout, kept with its text as the request asks
        fields:
          - {path: EventDetail/Unknown/Data, data_name: severity, field: severity}
