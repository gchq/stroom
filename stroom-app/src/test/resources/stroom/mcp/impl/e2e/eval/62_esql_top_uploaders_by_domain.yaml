name: Top uploaders by site domain, on an Elasticsearch index (a question, nothing built)
kind: question
capabilities: [elasticsearch, esql, aggregation]
# A question about data already indexed: 10,000 web proxy upload events (esql/proxy-uploads-generator.py, made in
# Java by EvalProxyUploads) behind the Elastic Index doc "Proxy uploads". The answer is a multi-key aggregation:
# STATS SUM BY user and domain, SORT DESC, LIMIT. The traps: run_stroomql reading every document through Stroom to
# group them where esql_query has Elasticsearch group them; the ranking given from rows cut short without saying how
# many pairs there are; a text or wrong field grouped by. The answer is the last esql_query call's rows, worked out
# by the generator.
elastic_index: {name: Proxy uploads}
request: >
  Which users have uploaded the most data, by site domain? Use the "Proxy uploads" Elasticsearch index. Give me the
  top 10 user and site domain pairs by total bytes uploaded, largest first, and say how many user and domain pairs
  there are in all.
user_knows: >
  The index is "Proxy uploads". user.name is the user, url.domain the site domain, and http.request.bytes the size of
  each upload in bytes. Every upload counts, allowed or blocked, over all the time the index holds.
expected:
  tools_used: [esql_query]
  answer:
    ordered: true
    total_groups: 88
    rows:
      - [erin, files.example.com, 95069620]
      - [erin, box.com, 71742644]
      - [erin, github.com, 58993852]
      - [erin, intranet.example.com, 56580404]
      - [erin, drive.google.com, 52841136]
      - [erin, mega.nz, 47674524]
      - [carol, files.example.com, 47612242]
      - [erin, icloud.com, 45397728]
      - [carol, box.com, 42770540]
      - [erin, dropbox.com, 42262836]
reference:
  esql_query:
    pipeline: >-
      | STATS total = SUM(http.request.bytes) BY user.name, url.domain
      | SORT total DESC, user.name, url.domain
      | LIMIT 10
