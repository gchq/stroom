name: An archive then a personal cloud upload within the hour, by the same person (a question, nothing built)
kind: question
capabilities: [sequence, elasticsearch, eql, insider]
# The insider-risk dataset's endpoint and proxy events from 8 to 23 September 2026 in one Elasticsearch index
# "Insider events". The leaver (P10001) archives files and uploads to personal cloud within the hour on 10, 15, 17
# and 22 September, on the 15th and 17th again in the evening (the known answer's uploads); an approved migration
# (P20001, May) isn't in these days. The answer: sequence_query by PersonId, the endpoint's EventCode file.archive
# then a proxy event in Category "Personal Cloud Storage" with BytesOut over 10 MB, within 1h; the rows worked out
# from the generator by TestEvalCases. The traps: joining by UserName (dwhitfield on the endpoint, dana.whitfield on
# the proxy, so nothing matches), and counting the many small personal cloud page views as uploads.
# Skipped without an Elasticsearch node.
elastic_index:
  name: Insider events
  generate: {kind: insider_events, seed: 5848, background: 5, scale: 0.3, from: '2026-09-08', to: '2026-09-23',
             sources: [endpoint, proxy]}
  fields: {EventTime: date, Source: text, PersonId: text, UserName: text, Account: text, HostName: text,
           EventDetail: text, Action: text, EventCode: text, Process: text, WindowTitle: text, WindowId: text,
           Object: text, Destination: text, Category: text, BytesOut: long, SessionId: text, Country: text,
           Site: text}
request: >
  Between 8 and 23 September 2026, did anyone archive files and then upload more than 10 MB to a personal cloud
  service within an hour? Use the "Insider events" Elasticsearch index. Give each person with the time of the
  archive and of the upload.
user_knows: >
  PersonId is the person's id, the same in every source; UserName differs by source. EventCode file.archive is an
  archive made on the endpoint. Category is the proxy's site category ("Personal Cloud Storage" for personal cloud),
  BytesOut the bytes uploaded. The period is 8 September 2026 00:00 to 24 September 2026 00:00, Sydney time
  (UTC+10).
expected:
  tools_used: [sequence_query]
  answer:
    tool: sequence_query
    ordered: false
    rows:
      - [P10001, '2026-09-10T05:56:00.000Z', '2026-09-10T06:02:49.000Z']
      - [P10001, '2026-09-15T06:07:00.000Z', '2026-09-15T06:17:02.000Z']
      - [P10001, '2026-09-15T11:24:00.000Z', '2026-09-15T11:32:37.000Z']
      - [P10001, '2026-09-17T05:28:00.000Z', '2026-09-17T05:37:58.000Z']
      - [P10001, '2026-09-17T11:23:00.000Z', '2026-09-17T11:29:45.000Z']
      - [P10001, '2026-09-22T06:14:00.000Z', '2026-09-22T06:22:42.000Z']
reference:
  sequence_query:
    steps:
      - {index: Insider events, by: [PersonId], where: [{field: EventCode, value: file.archive}]}
      - {index: Insider events, by: [PersonId], where: [{field: Category, value: Personal Cloud Storage},
         {field: BytesOut, condition: GREATER_THAN, value: '10000000'}]}
    maxspan: 1h
    timeFrom: '2026-09-07T14:00:00.000Z'
    timeTo: '2026-09-23T14:00:00.000Z'
