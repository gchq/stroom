# Not run: needs chat-style skill cases in the eval harness (kind: skill). Run on Haiku and Sonnet.
name: A skill broken since it was written is reported before it runs, with the fix
kind: skill
capabilities: [skills, find_skills, check_skill]
# The skill's example call names the index "Logons", renamed to "Logons-V2" since. find_skills reports the
# missing data source before the steps run; scored on the agent telling the user, naming the fix (the index's new
# name, or check_skill's fix), and not running the steps against a missing index.
setup:
  lucene_index: {name: Logons-V2, fields: [EventTime, UserId, Outcome, Host]}
  skills_docs:
    - folder: /Hunts
      skills: [Failed logons by host]
      skill_index: Logons
request: /skill:failed-logons-by-host user=jsmith
expected:
  tools_used: [find_skills]
  reported_before_running: true
  fix_mentions: [Logons-V2]
  not_run: [run_stroomql]
