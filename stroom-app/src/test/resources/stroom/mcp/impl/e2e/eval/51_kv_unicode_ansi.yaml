name: App log written for a terminal (key=value, a byte order mark, Unicode names, ANSI colour codes)
template: Event Data (Text)
capabilities: [encoding]
# An app's log, 400 lines, as it shows in a terminal: a byte order mark before the first line, people's names in
# Latin, Greek and Japanese script, and messages coloured with ANSI escape codes (ESC [32m OK ESC [0m). The traps:
# the byte order mark is not part of the first key; the names come through whole, accents and all; and the escape
# codes are control characters an XML 1.0 document can't hold (Stroom's records are XML 1.1, which can), taken
# out of the description with transform: strip_control.
request: >
  Onboard our app's log (the file on my disk). Index the logons and logoffs.
expected:
  records: 400
  event_types: [Authenticate]
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventDetail/TypeId]
  values:
    EventSource/User/Name: [José Álvarez, 山田太郎, Ελένη Παππά]
files:
  - {name: app-terminal.log, generate: {kind: unicode_app, records: 400, seed: 17}}
reference:
  splitter: infer
  mapping:
    input: data_splitter
    common:
      - {path: EventTime/TimeCreated, field: time, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
      - {path: EventSource/System/Name, value: Terminal App}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: app}
      - {path: EventSource/Device/HostName, value: app01}
      - {path: EventSource/User/Id, field: user}
      - {path: EventSource/User/Name, field: name}
      - {path: EventDetail/TypeId, field: action}
      - {path: EventDetail/Description, field: msg, transform: strip_control}
    events:
      - name: logon
        when: [{field: action, equals: login}]
        fields:
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: user}
          - {path: EventDetail/Authenticate/Outcome/Success, field: result, map: {success: 'true', failure: 'false'}}
      - name: logoff
        when: [{field: action, equals: logout}]
        fields:
          - {path: EventDetail/Authenticate/Action, value: Logoff}
          - {path: EventDetail/Authenticate/User/Id, field: user}
