name: Door controller export (the source's own XML is <records><record>)
template: Event Data (XML)
capabilities: [format_recognition, event_boundaries]
request: >
  Onboard the door controllers' export. It's an XML document, <records> holding a <record> per badge swipe, with
  no namespace: when, the badge holder, the door and whether access was granted. Times are UTC. Index the events.
# The trap: a document whose root is records/record, like a Data Splitter's output, is the source's own XML, in no
# namespace (not records:2), and becomes Events like any other.
expected:
  records: 4
  event_types: ['Authenticate|Authorise']
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventSource/Device/Name]
  values:
    EventSource/User/Id: [alice, bob, carol]
sample: |
  <?xml version="1.0" encoding="UTF-8"?>
  <records>
  <record><when>2026-10-02T07:58:00Z</when><holder>alice</holder><door>Main entrance</door><granted>true</granted></record>
  <record><when>2026-10-02T08:02:00Z</when><holder>bob</holder><door>Server room</door><granted>false</granted></record>
  <record><when>2026-10-02T08:10:00Z</when><holder>alice</holder><door>Server room</door><granted>true</granted></record>
  <record><when>2026-10-02T08:31:00Z</when><holder>carol</holder><door>Loading bay</door><granted>true</granted></record>
  </records>
reference:
  mapping:
    input: xml
    root: records
    record: record
    common:
      - {path: EventTime/TimeCreated, field: when, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
      - {path: EventSource/System/Name, value: Door Control}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: door-controller}
      - {path: EventSource/Device/Name, field: door}
      - {path: EventSource/User/Id, field: holder}
      - {path: EventDetail/TypeId, value: badge}
    events:
      - name: badge
        fields:
          - {path: EventDetail/Authorise/Action, value: Request}
          - {path: EventDetail/Authorise/Resource/Name, field: door}
          - {path: EventDetail/Authorise/Outcome/Success, field: granted}
