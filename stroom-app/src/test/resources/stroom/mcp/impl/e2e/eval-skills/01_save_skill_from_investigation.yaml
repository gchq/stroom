# Not run: the eval harness has no chat-style skill cases yet (kind: skill). Kept for when it does (the agent eval
# harness over /mcp is shelved; TestE2eEvalReference runs build and question cases only). Run on Haiku and Sonnet.
name: Saving a skill from a finished investigation
kind: skill
capabilities: [skills, propose_skill, check_skill]
# A chat counted jsmith's failed logons over the last 7 days in a Lucene index, then the user asks to save it as a
# skill. Scored on the proposal: its parameters are the values that vary (the user, the period), not the index or
# the conditions that define the work; its steps name real tools with example calls that fit their schemas; and
# check_skill finds no problems in it.
setup:
  lucene_index: {name: Logons, fields: [EventTime, UserId, Outcome, Host]}
  folder: /Hunts
  chat:
    - ask: How many failed logons did jsmith have in the last 7 days, by host?
    - expect_tools: [run_stroomql]
request: Save this as a skill.
user_knows: >
  Call it "Failed logons by host". People ask "how many failed logons did <user> have" and "failed logons by host
  for a user". The user and the number of days vary; results go in a table in the chat. Save it in /Hunts.
expected:
  tools_used: [propose_skill]
  proposal:
    folder: /Hunts
    parameters: [user, days]
    not_parameters: [Logons, Outcome]
    steps_call: [run_stroomql]
    check_skill_problems: 0
