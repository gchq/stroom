name: Microsoft 365 unified audit log, a later build (OneDrive joins the promoted Messaging group)
template: Event Data (JSON)
capabilities: [aggregated_feeds, source_types, later_builds]
# A later build on an aggregated feed: case 56 built and promoted first (its feed, data, registry beside the feed, the
# Messaging group's pipeline, XSLT and index), then the user asks for OneDrive to join the Messaging group. The
# traps: a new group made instead of joining Messaging; the promoted Messaging pipeline changed in place (a promoted
# pipeline and the code it runs change only by a new version, decided by the user 2026-11-17: the group's rows move
# to the new version, whose names the user confirms); Messaging's existing rules lost from its mapping; the other
# workloads' records taken for errors; the build left unpromoted, so production never takes OneDrive. Its Events go
# into Messaging's own index, which gains OneDrive's fields at promotion.
setup: {from_case: 56}
promote: true
request: >
  Our Microsoft 365 audit log is onboarded already: its feed carries every workload's records, and the Messaging
  group (Exchange Online and Teams) is built and promoted. Add the OneDrive records to the Messaging group, so its
  pipeline translates them too and they are indexed in the Messaging index with the rest of the group. Promote the
  build when it's done.
user_knows: >
  OneDrive joins the existing Messaging group; no new group. Messaging then holds ExchangeOnline, MicrosoftTeams and
  OneDrive. SharePoint and AzureActiveDirectory stay parked for later builds. The change goes into a new version of
  the Messaging pipeline (its names as proposed are fine), promoted beside the current one. The Workload field says
  which workload a record came from, as before; Operation is
  what was done within a workload, so it tells the kinds of event apart. The other workloads' records being passed
  over by the Messaging pipeline is expected; they are not errors. Promote the build, keeping its documents where
  the feed's other documents are. The system is Microsoft 365.
  Users' Ids stay whole, with their domain (sam.taylor@contoso.example), as Messaging writes them.
  String values longer than Stroom's JSON parser keeps (mail and message bodies past 10,000 characters) may be
  cut: the user is happy for them to be cut rather than kept whole.
expected:
  # The event type catalogue: Verb-Object TypeIds (the vendor's code as Data), at least so many event types,
  # and, once catalogue_event_types confirms one, its checks.
  type_ids: {min_distinct: 7}
  catalogue: {catch_all_confirmed: true, no_overlaps: true, no_condition_on_source_type_field: true}
  records: 192
  event_types: [View, Send, Create|Update, Delete|Move]
  paths: [EventTime/TimeCreated, EventSource/User/Id]
  values:
    EventSource/User/Id: [sam.taylor@contoso.example, priya.nair@contoso.example, anja.michel@contoso.example]
    EventSource/Generator: [ExchangeOnline, MicrosoftTeams, OneDrive]
  forbidden_values:
    EventSource/Generator: [SharePoint, AzureActiveDirectory]
  # Their operations, the vendor's code, which every event holds as Data: in none.
  forbidden_texts: [UserLoggedIn, UserLoginFailed, Add member to role., Reset user password.]
  source_types:
    # Scored on the registry beside the feed, after promotion.
    promoted: true
    field: Workload
    group:
      name: Messaging
      values: [ExchangeOnline, MicrosoftTeams, OneDrive]
      others: [SharePoint, AzureActiveDirectory]
    groups: [Messaging]
    pipeline: new
    rows:
      - {match: value, value: SharePoint, status: parked}
      - {match: value, value: AzureActiveDirectory, status: parked}
    passed_over: 208
    index: {fields_added: when_needed}
    # Role first, then version: the group's new version promoted beside the setup's V1.0, in a version folder of
    # its own.
    layout: "/Messaging/Events/V(?!1\\.0$)\\d+(\\.\\d+)*$"
  forms:
    asked:
      - {message: "go in this build's source type group"}
    not_asked: ["Which field says which source", "runs in pipeline"]
  # What the events hold in the schema's own elements rather than Data, as case 56's (test chat 182), and OneDrive's
  # files typed.
  # typed_at_least (2026-11-22, in place of Data-share caps a build keeping every field it doesn't place as Data
  # can't meet): the fewest distinct typed leaf paths the event type's events hold, set above Haiku eval run 1's
  # build (only what the schema requires placed) and below the reference's.
  typed:
    - select: {text: MailItemsAccessed}
      paths: ["View/Folder/Path|View/Folder/Id|View/Folder/Name|View/Object/Id|View/Object/Name|View/Email/Id"]
      typed_at_least: 4
    - select: {text: Send}
      paths:
        - "Send/Source/User/Id|Send/Source/User/EmailAddress|Send/Payload/Email/From/Id\
          |Send/Payload/Email/From/EmailAddress"
        - "Send/Destination/User/Id|Send/Destination/User/EmailAddress|Send/Payload/Email/To/Id\
          |Send/Payload/Email/To/EmailAddress"
        - "Send/Payload/Email/Subject|Send/Payload/Email/Name"
      typed_at_least: 5
    - select: {text: New-InboxRule}
      paths: ["Create/Configuration/Name|Create/Object/Name|Update/After/Configuration/Name|Update/After/Object/Name"]
      typed_at_least: 2
    - select: {text: MoveToDeletedItems}
      paths:
        - "Move/Source/Folder/Path|Move/Source/Folder/Id|Move/Source/Folder/Name|Delete/Folder/Path|Delete/Folder/Id\
          |Delete/Folder/Name|Update/Before/Folder/Path|Update/Before/Folder/Id|Update/Before/Folder/Name"
        - "Move/Destination/Folder/Path|Move/Destination/Folder/Id|Move/Destination/Folder/Name|Update/After/Folder/Path\
          |Update/After/Folder/Id|Update/After/Folder/Name|Delete/Folder/Path|Delete/Folder/Id|Delete/Folder/Name"
      typed_at_least: 3
    - select: {text: MessageSent}
      paths:
        - "Send/Source/User/Id|Send/Source/User/EmailAddress|Send/Payload/Chat/From/Id\
          |Send/Payload/Chat/From/EmailAddress|Send/Payload/GroupChat/From/Id|Send/Payload/GroupChat/From/EmailAddress"
        - "Send/Destination/User/Id|Send/Destination/User/EmailAddress|Send/Payload/Chat/To/Id\
          |Send/Payload/Chat/To/EmailAddress|Send/Payload/GroupChat/To/Id|Send/Payload/GroupChat/To/EmailAddress"
      typed_at_least: 4
    - select: {text: TeamMemberAdded}
      paths:
        - "Authorise/AddGroups/Group/Name|Authorise/AddGroups/Group/Id|Authorise/Group/Name|Authorise/Group/Id\
          |Update/After/Group/Name|Update/After/Group/Id|Update/After/User/Groups/Group/Name\
          |Update/After/User/Groups/Group/Id|Authorise/User/Groups/Group/Name|Authorise/User/Groups/Group/Id"
        - "Authorise/User/Id|Authorise/User/EmailAddress|Authorise/User/Name|Update/After/User/Id\
          |Update/After/User/EmailAddress|Update/After/User/Name|Update/Changes/Add/User/Id\
          |Update/Changes/Add/User/EmailAddress|Update/Changes/Add/User/Name"
      typed_at_least: 4
    - select: {text: FileAccessed}
      paths: ["View/File/Path|View/File/Name|View/File/Id|View/Document/Path|View/Document/Name|View/Document/Id\
          |View/Object/Name|View/Object/Id"]
      typed_at_least: 3
    - select: {text: FileModified}
      paths: ["Update/After/File/Path|Update/After/File/Name|Update/After/File/Id|Update/After/Document/Name\
          |Update/After/Document/Id|Update/After/Object/Name|Update/After/Object/Id"]
      typed_at_least: 3
reference:
  # The user chose to cut values longer than the JSON parser keeps (user_knows): recorded with the draft.
  long_values: cut
  source_types:
    group: Messaging
    source_types: [OneDrive]
  mapping:
    input: json
    json_layout: lines
    common:
      - {path: EventTime/TimeCreated, field: CreationTime, time_format: "yyyy-MM-dd'T'HH:mm:ss", timezone: UTC}
      - {path: EventSource/System/Name, value: Microsoft 365}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, field: Workload}
      - {path: EventSource/Device/Name, value: Microsoft 365}
      - {path: EventSource/User/Id, field: UserId}
      - {path: EventSource/Client/IPAddress, field: ClientIP}
    events:
      - name: mail_read
        when: [{field: Operation, equals: MailItemsAccessed}]
        fields:
          - {path: EventDetail/TypeId, value: View-MailItems}
          - {path: EventDetail/Description, value: Mail items were accessed}
          - {path: EventDetail/View/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/View/Data, data_name: MailAccessType,
             xpath: "*[@key='event']/*[@key='OperationProperties']/*[*[@key='Name'] = 'MailAccessType']/*[@key='Value']"}
          # The tools write one object, so one Folder (a group may only repeat an element the schema repeats on
          # its own): the first folder accessed.
          - {path: EventDetail/View/Folder/Type, value: Mail folder}
          - {path: EventDetail/View/Folder/Id, xpath: "*[@key='event']/*[@key='Folders']/*[1]/*[@key='Id']"}
          - {path: EventDetail/View/Folder/Path, xpath: "*[@key='event']/*[@key='Folders']/*[1]/*[@key='Path']"}
          # The first item read in it, and the mailbox read.
          - {path: EventDetail/View/Email/Id,
             xpath: "*[@key='event']/*[@key='Folders']/*[1]/*[@key='FolderItems']/*[1]/*[@key='InternetMessageId']"}
          - {path: EventDetail/View/User/EmailAddress, field: event.MailboxOwnerUPN}
      - name: mail_send
        when: [{field: Operation, equals: Send}]
        fields:
          - {path: EventDetail/TypeId, value: Send-Mail}
          - {path: EventDetail/Description, value: A message was sent}
          - {path: EventDetail/Send/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Send/Source/User/EmailAddress, field: UserId}
          - {path: EventDetail/Send/Source/Device/IPAddress, field: ClientIP}
          - {path: EventDetail/Send/Destination/User, for_each: {array: event.Item.Recipients}, as: recipient,
             fields: [{path: EmailAddress, item: true}]}
          - {path: EventDetail/Send/Payload/Email/Type, value: Email}
          - {path: EventDetail/Send/Payload/Email/Id, field: event.Item.InternetMessageId}
          - {path: EventDetail/Send/Payload/Email/From/EmailAddress, field: UserId}
          - {path: EventDetail/Send/Payload/Email/Subject, field: event.Item.Subject}
          - {path: EventDetail/Send/Payload/Email/Data, data_name: SizeInBytes, field: event.Item.SizeInBytes}
      - name: inbox_rule
        when: [{field: Operation, equals: New-InboxRule}]
        fields:
          - {path: EventDetail/TypeId, value: Create-InboxRule}
          - {path: EventDetail/Description, value: An inbox rule was created}
          - {path: EventDetail/Create/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Create/Configuration/Type, value: Inbox rule}
          - {path: EventDetail/Create/Configuration/Name,
             xpath: "*[@key='event']/*[@key='Parameters']/*[*[@key='Name'] = 'Name']/*[@key='Value']"}
          - {path: EventDetail/Create/Configuration/Data, data_name: SubjectContainsWords,
             xpath: "*[@key='event']/*[@key='Parameters']/*[*[@key='Name'] = 'SubjectContainsWords']/*[@key='Value']"}
          # The mailbox the rule is on.
          - {path: EventDetail/Create/User/EmailAddress, field: event.MailboxOwnerUPN}
      - name: mail_deleted
        when: [{field: Operation, equals: MoveToDeletedItems}]
        fields:
          - {path: EventDetail/TypeId, value: Move-MailItems}
          - {path: EventDetail/Description, value: Messages were moved to Deleted Items}
          - {path: EventDetail/Move/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Move/Source/Folder/Id, field: event.Folder.Id}
          - {path: EventDetail/Move/Source/Folder/Path, field: event.Folder.Path}
          - {path: EventDetail/Move/Destination/Folder/Id, field: event.DestFolder.Id}
          - {path: EventDetail/Move/Destination/Folder/Path, field: event.DestFolder.Path}
      - name: teams_message
        when: [{field: Operation, equals: MessageSent}]
        fields:
          - {path: EventDetail/TypeId, value: Send-TeamsMessage}
          - {path: EventDetail/Description, value: A message was posted in Teams}
          - {path: EventDetail/Send/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Send/Source/User/EmailAddress, field: UserId}
          - {path: EventDetail/Send/Source/Device/IPAddress, field: ClientIP}
          - {path: EventDetail/Send/Destination/User, for_each: {array: event.Recipients}, as: recipient,
             fields: [{path: EmailAddress, item: true}]}
          - {path: EventDetail/Send/Payload/Chat/Id, field: event.MessageId}
          - {path: EventDetail/Send/Payload/Chat/SessionId, field: event.ChatThreadId}
          - {path: EventDetail/Send/Payload/Chat/Room, field: event.ChannelName}
          - {path: EventDetail/Send/Data, data_name: team, field: event.TeamName}
      - name: team_member_added
        when: [{field: Operation, equals: TeamMemberAdded}]
        fields:
          - {path: EventDetail/TypeId, value: Add-TeamMember}
          - {path: EventDetail/Description, value: A member was added to a team}
          - {path: EventDetail/Authorise/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Authorise/Action, value: Modify}
          # The first member added typed (one User, as the tools write it), every member's UPN as Data.
          - {path: EventDetail/Authorise/User/Id, xpath: "*[@key='event']/*[@key='Members']/*[1]/*[@key='UPN']"}
          - {path: EventDetail/Authorise/User/Name,
             xpath: "*[@key='event']/*[@key='Members']/*[1]/*[@key='DisplayName']"}
          - {path: EventDetail/Authorise/Data, data_name: member, for_each: {array: event.Members}, as: member,
             fields: [{path: Data, data_name: UPN, field: UPN}]}
          - {path: EventDetail/Authorise/AddGroups/Group/Id, field: event.TeamGuid}
          - {path: EventDetail/Authorise/AddGroups/Group/Name, field: event.TeamName}
      - name: meeting
        when: [{field: Operation, equals: MeetingParticipantDetail}]
        fields:
          - {path: EventDetail/TypeId, value: View-MeetingDetail}
          - {path: EventDetail/Description, value: A meeting participant's details were recorded}
          - {path: EventDetail/View/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/View/Object/Type, value: Teams meeting}
          - {path: EventDetail/View/Object/Id, field: event.MeetingDetailId}
      - name: file_read
        when: [{field: Operation, one_of: [FileAccessed, FileDownloaded]}]
        fields:
          - {path: EventDetail/TypeId, value: View-File}
          - {path: EventDetail/Description, value: A file was accessed or downloaded}
          - {path: EventDetail/View/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/View/File/Type, field: event.ItemType}
          - {path: EventDetail/View/File/Id, field: event.ListItemUniqueId}
          - {path: EventDetail/View/File/Name, field: event.SourceFileName}
          - {path: EventDetail/View/File/Path, field: event.ObjectId}
          - {path: EventDetail/View/Data, data_name: Platform, field: event.Platform}
      - name: file_changed
        when: [{field: Operation, one_of: [FileModified, SharingSet]}]
        fields:
          - {path: EventDetail/TypeId, value: Update-File}
          - {path: EventDetail/Description, value: A file was modified or shared}
          - {path: EventDetail/Update/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Update/After/File/Type, field: event.ItemType}
          - {path: EventDetail/Update/After/File/Id, field: event.ListItemUniqueId}
          - {path: EventDetail/Update/After/File/Name, field: event.SourceFileName}
          - {path: EventDetail/Update/After/File/Path, field: event.ObjectId}
          - {path: EventDetail/Update/Data, data_name: shared_with, field: event.TargetUserOrGroupName}
