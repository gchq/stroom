name: USB copy monitor (headerless CSV)
template: Event Data (Text)
capabilities: [delimiters, schema_inference]
request: >
  Onboard these data-loss-prevention logs: CSV without a header. The columns are time, user, host, source path and
  destination path; each line is a file copied to removable media. Index them.
expected:
  records: 3
  event_types: [Copy]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventDetail/Copy/Source/File/Path, EventDetail/Copy/Destination/File/Path]
sample: |
  2026-09-28T16:00:00Z,henry,ws11,/home/henry/report.pdf,/media/usb0/report.pdf
  2026-09-28T16:04:21Z,ivy,ws12,/home/ivy/customers.csv,/media/usb1/customers.csv
  2026-09-28T16:30:09Z,henry,ws11,/home/henry/photo.jpg,/media/usb0/photo.jpg
reference:
  converter: |
    <?xml version="1.1" encoding="UTF-8"?>
    <dataSplitter xmlns="data-splitter:3" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="data-splitter:3 file://data-splitter-v3.0.xsd" version="3.0">
      <split delimiter="\n">
        <group>
          <regex pattern="^([^,]*),([^,]*),([^,]*),([^,]*),([^,]*)$">
            <data name="time" value="$1" /><data name="user" value="$2" /><data name="host" value="$3" />
            <data name="source" value="$4" /><data name="destination" value="$5" />
          </regex>
        </group>
      </split>
    </dataSplitter>
  mapping:
    input: data_splitter
    common:
      - {path: EventTime/TimeCreated, field: time, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
      - {path: EventSource/System/Name, value: DLP}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: usb-monitor}
      - {path: EventSource/Device/HostName, field: host}
      - {path: EventSource/User/Id, field: user}
    events:
      - name: copy to removable media
        fields:
          - {path: EventDetail/TypeId, value: USB-Copy}
          - {path: EventDetail/Copy/Source/File/Path, field: source}
          - {path: EventDetail/Copy/Destination/File/Path, field: destination}
