name: JSON array wrapping JSON wrapping a message string
template: Event Data (JSON)
capabilities: [mixed_formats, nesting]
request: >
  Onboard these gateway logs. The shipper sends a JSON array (host, received time) and puts the gateway's own JSON
  record in the payload field as a string: ts, level and msg. The msg text is the event itself:
  "user=<id> action=<LOGIN or LOGOUT> src=<client address> result=<success or failure>". Index the events.
expected:
  records: 3
  event_types: [Authenticate]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventSource/Client/IPAddress, EventDetail/Authenticate/Action]
sample: |
  [{"host": "gw01", "received": "2026-10-01T10:00:02Z", "payload": "{\"ts\": \"2026-10-01T10:00:00Z\", \"level\": \"INFO\", \"msg\": \"user=alice action=LOGIN src=10.0.0.1 result=success\"}"},
   {"host": "gw01", "received": "2026-10-01T10:05:02Z", "payload": "{\"ts\": \"2026-10-01T10:05:00Z\", \"level\": \"WARN\", \"msg\": \"user=bob action=LOGIN src=10.0.0.9 result=failure\"}"},
   {"host": "gw02", "received": "2026-10-01T10:30:01Z", "payload": "{\"ts\": \"2026-10-01T10:30:00Z\", \"level\": \"INFO\", \"msg\": \"user=alice action=LOGOUT src=10.0.0.1 result=success\"}"}]
reference:
  mapping:
    input: json
    json_layout: array
    extract:
      - {xpath: "json-to-xml(*[@key='payload'])/*/*[@key='msg']", regex: '^user=(\S+) action=(\S+) src=(\S+) result=(\S+)$',
         names: [user, action, src, result]}
    common:
      - {path: EventTime/TimeCreated, xpath: "json-to-xml(*[@key='payload'])/*/*[@key='ts']", time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
      - {path: EventSource/System/Name, value: Gateway}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: gateway}
      - {path: EventSource/Device/HostName, field: host}
      - {path: EventSource/Client/IPAddress, field: src}
      - {path: EventSource/User/Id, field: user}
      - {path: EventDetail/TypeId, field: action}
      - {path: EventDetail/Description, xpath: "json-to-xml(*[@key='payload'])/*/*[@key='msg']"}
      - {path: EventDetail/Authenticate/User/Id, field: user}
      - {path: EventDetail/Authenticate/Outcome/Success, field: result, map: {success: "true", failure: "false"}}
    events:
      - name: logon
        when: [{field: action, equals: LOGIN}]
        fields: [{path: EventDetail/Authenticate/Action, value: Logon}]
      - name: logoff
        when: [{field: action, equals: LOGOUT}]
        fields: [{path: EventDetail/Authenticate/Action, value: Logoff}]
