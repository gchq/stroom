name: A day's chat thread on two topics and a PowerShell session, as runs of messages and commands in the activities view (a chat)
kind: chat
capabilities: [timeline, elasticsearch, levels, characterise]
# One person's day (dmorgan, 19 November 2026) in one Elasticsearch index "Messages and processes", made by
# EvalTimelineScenes (scene message_command_runs): a chat thread (EventCode chat.message, Text the message, Thread
# the conversation) whose first six messages are about the weekend on-call rota and the next six about renewing the
# VPN certificate, with no gap between them; and a PowerShell session's commands (process.start, the command line
# in Command, a field of its own the timeline finds by its name, with no Text; Thread the shell's session) that
# list directory users, export them to a CSV, zip it and copy the zip to a share. Run in
# Stroom's chat, where the characterisation's and the levels' side calls go to the chat's model (scripted in the
# reference, side_answers). Scored on activity-levels.csv: two message runs split where the topic changes, one
# command run, each a level-2 row under an activity that is a level-1 row of its own, each described by the model
# citing events of its own run. The traps: one run for the whole thread, the commands as one-off events (their
# command lines not read as their text), an activity of messages alone with no row, the other person's thread.
# Skipped without an Elasticsearch node.
elastic_index:
  name: Messages and processes
  generate: {kind: timeline_scenes, scene: message_command_runs, seed: 115}
  fields: {EventTime: date, Source: text, UserName: text, Host: text, EventCode: text, Thread: text, Text: text,
           Process: text, Command: text}
request: >
  What was dmorgan doing on 19 November 2026? Build their activity timeline from the "Messages and processes"
  Elasticsearch index, and tell me what they discussed and what their PowerShell session did.
user_knows: >
  Source says which product wrote each event: messages (EventCode chat.message, Text the message, Thread the
  conversation) and endpoint (EventCode process.start: a process started, Process the program, Command its command
  line, Thread the shell's session). The day is 19 November 2026 00:00 UTC up to, not including, 20 November 2026.
  Characterise with the model.
expected:
  tools_used: [activity_timeline]
  # Scored on activity-levels.csv and events.csv (EvalTimelineScore), never on the model's wording: the runs' member
  # events, their texts (the level-3 rows' labels), the events each description cites and each run's parent.
  timeline:
    entity: dmorgan
    runs:
      - {matches: 'rota|on.call|handover', events: 6}
      - {matches: 'certificate|CSR', events: 6}
      - {matches: 'Get-ADUser|Compress-Archive|Copy-Item', events: 4}
    runs_total: 3
    runs_described_with_evidence: true
    # Each run under the activity its events were classified in, that activity a level-1 row of the table: an
    # activity of loose items alone (these messages and commands, in no span of an activity) has a row spanning its
    # items' times.
    runs_under_activity: true
    runs_parent_rows: true
reference:
  calls:
    - {tool: activate_timelines, arguments: {}}
    - tool: activity_timeline
      arguments:
        entity: dmorgan
        timeFrom: '2026-11-19T00:00:00.000Z'
        timeTo: '2026-11-20T00:00:00.000Z'
        timeZone: UTC
        view: activities
        sources:
          - {index: Messages and processes, user: UserName, host: Host, process: Process, text: Text,
             eventTypeField: EventCode, typeRoles: {chat.message: action, process.start: action}}
  side_answers:
    - contains: [You classify a user's activity records]
      classify:
        - {matches: 'rota|on-call|on call|handover', name: Weekend on-call rota}
        - {matches: 'certificate|CSR', name: VPN certificate renewal}
        - {matches: 'Get-ADUser|Export-Csv|Compress-Archive|Copy-Item', name: Directory users export}
    - contains: [You group a user's timeline]
      answer: >-
        [{"id": "r1", "description": "discussed the on-call rota, then the VPN certificate", "confidence": "high",
        "evidence": ["e1", "e7"], "parts": [{"from": "e1", "description": "arranged the weekend on-call rota",
        "evidence": ["e1", "e3", "e6"]}, {"from": "e7", "description": "discussed renewing the VPN certificate",
        "evidence": ["e7", "e10", "e12"]}]},
        {"id": "r2", "description": "listed directory users, exported them to CSV, zipped and copied it to a share",
        "confidence": "high", "evidence": ["e1", "e2", "e3", "e4"]}]
  answer: >-
    dmorgan discussed the weekend on-call rota, then the VPN certificate's renewal, in the ops team's chat; their
    PowerShell session listed directory users, exported them to a CSV, zipped it and copied it to a share.
