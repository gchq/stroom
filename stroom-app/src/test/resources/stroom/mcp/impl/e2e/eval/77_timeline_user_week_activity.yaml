name: A user's activity timeline over a week, and what they were working on (a question, nothing built)
kind: question
capabilities: [timeline, elasticsearch, characterise]
# One user's week across sources in one Elasticsearch index (aggregated/activity-timeline, made by
# aggregated-feeds-generator.py, which also writes the sessions it planted): endpoint window focus, open and close,
# clipboard copies, saves and a removable copy (Source endpoint); logon, lock and unlock with the user written
# CORP\jsmith (windows); web accesses (proxy), AI chat prompts (aichat) and messages (messages), on a desktop and a
# laptop, beside another user's events. Planted gaps: Wednesday's unlock after lunch dropped (an idle start with no
# end), the endpoint silent on Thursday afternoon while the proxy shows browsing (source silence), Tuesday's Excel
# window never closed. The work: a Q3 finance proposal (Word, pricing research, a deck, prompts and messages about
# it) and a supplier contract review (Acrobat, legal research). activity_timeline answers it, the active time by
# host and application its rows (the generator's planted sessions, summed). The traps: the sources hold the user
# differently (strip_domain on the logons), the other user's events, and reading a gap as idleness.
# Skipped without an Elasticsearch node.
elastic_index:
  name: User activity
  events: aggregated/activity-timeline/activity-timeline.csv
  fields: {EventTime: date, Source: text, UserName: text, Host: text, Process: text, WindowTitle: text,
           WindowId: text, EventType: text, Object: text, Text: text}
request: >
  Build a timeline of jsmith's activity in the week starting Monday 9 November 2026, from the "User activity"
  Elasticsearch index, and tell me what they were working on. How long were they active in each application on each
  host, and is anything missing from the logs?
user_knows: >
  Source says which product wrote each event: endpoint (EventType focus, open, close, clipboard, save,
  removable_copy), windows (lock, unlock; UserName is CORP\jsmith there), proxy (web), aichat (prompt, the prompt in
  Text) and messages (message, its text in Text). Host is the host, Process the application, WindowTitle the window
  title, WindowId the window, Object the file or URL. The week is 9 November 2026 00:00 UTC up to, not including,
  14 November 2026.
expected:
  tools_used: [activity_timeline]
  answer:
    tool: activity_timeline
    ordered: false
    tolerance: 0.01
    result: {entity: jsmith, session_count: 63}
    rows:
      - [ws-jsmith-01, WINWORD.EXE, 20, 1060.0]
      - [ws-jsmith-01, chrome.exe, 16, 365.0]
      - [ws-jsmith-01, OUTLOOK.EXE, 12, 334.0]
      - [ws-jsmith-01, ACROBAT.EXE, 6, 255.0]
      - [lt-jsmith-02, POWERPNT.EXE, 2, 80.0]
      - [ws-jsmith-01, Teams.exe, 5, 50.0]
      - [ws-jsmith-01, EXCEL.EXE, 1, 25.0]
      - [lt-jsmith-02, Teams.exe, 1, 10.0]
  data_quality: [idle_start_without_end, source_silence, open_without_close]
  activities: [Q3 finance proposal, supplier contract review]
reference:
  activity_timeline:
    entity: jsmith
    timeFrom: '2026-11-09T00:00:00.000Z'
    timeTo: '2026-11-14T00:00:00.000Z'
    timeZone: UTC
    characterise: true
    sources:
      - {index: User activity, name: Endpoint, user: UserName, host: Host, process: Process, title: WindowTitle,
         window: WindowId, object: Object, roles: {focus: {where: [{field: Source, value: endpoint}, {field: EventType, value: focus}]},
         open: {where: [{field: Source, value: endpoint}, {field: EventType, value: open}]}, close: {where: [{field: Source, value: endpoint}, {field: EventType, value: close}]},
         actions: [{kind: clipboard copy, where: [{field: Source, value: endpoint}, {field: EventType, value: clipboard}]}, {kind: file save, where: [{field: Source, value: endpoint}, {field: EventType, value: save}]},
         {kind: removable copy, where: [{field: Source, value: endpoint}, {field: EventType, value: removable_copy}]}]}}
      - {index: User activity, name: Logons, user: UserName, transform: [strip_domain], host: Host,
         roles: {idle_start: {where: [{field: Source, value: windows}, {field: EventType, value: lock}]}, idle_end: {where: [{field: Source, value: windows}, {field: EventType, value: unlock}]}}}
      - {index: User activity, name: Proxy, user: UserName, host: Host, object: Object,
         roles: {actions: [{kind: web access, where: [{field: Source, value: proxy}, {field: EventType, value: web}]}]}}
      - {index: User activity, name: AI chat, user: UserName, host: Host, object: Object, text: Text,
         roles: {actions: [{kind: AI prompt, where: [{field: Source, value: aichat}, {field: EventType, value: prompt}]}]}}
      - {index: User activity, name: Messages, user: UserName, host: Host, process: Process, text: Text,
         roles: {actions: [{kind: message, where: [{field: Source, value: messages}, {field: EventType, value: message}]}]}}
