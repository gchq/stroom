name: Endpoint agent (ECS-like JSON lines, flat dotted keys beside nested objects)
template: Event Data (JSON)
capabilities: [field_variability, event_types]
# Two shippers send the agent's events to one feed: one writes ECS's nested objects (`"event": {"action": ...}`), the
# other the same fields as flat keys holding dots (`"event.action": ...`, as Elastic's own agents can). A record of
# either spelling is the same event: one event type recognised two ways, never two event types, and never a flat
# record caught as uncatalogued. The trap: `event.action` read only as the nested object's, the flat records Unknown.
request: >
  Onboard our endpoint agent's events (JSON lines, below). Two shippers forward them: one nests the fields
  (event.action inside an event object), the other writes the same names as flat keys with dots in them. They are
  the same events either way. Index the events.
user_knows: >
  The flat keys (event.action, user.name, log.level, host.name) mean exactly what the nested fields of the same names
  mean: a sign-in, a sign-out or a file deletion whichever shipper sent it. message says what happened. The system is
  Endpoint Agent.
expected:
  records: 8
  event_types: [Authenticate, Delete]
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventSource/Device/HostName, EventDetail/Description]
  values:
    EventSource/User/Id: [alice, bob, carol, dave]
  type_ids:
    min_distinct: 3
    # A sign-in is one event type whichever shipper sent it, as is a file deletion.
    same:
      - [{action: user-login}]
      - [{action: file-delete}]
  unknown_at_most: 0
  catalogue: {catch_all_confirmed: true, no_overlaps: true, description_every: true,
              recognised_two_ways: [Authenticate-Logon]}
sample: |
  {"@timestamp": "2026-11-19T08:00:00.000Z", "event": {"action": "user-login", "outcome": "success"}, "log": {"level": "info"}, "user": {"name": "alice"}, "host": {"name": "ws01"}, "message": "alice signed in"}
  {"@timestamp": "2026-11-19T08:01:00.000Z", "event.action": "user-login", "event.outcome": "failure", "log.level": "warn", "user.name": "bob", "host.name": "ws02", "message": "bob failed to sign in"}
  {"@timestamp": "2026-11-19T08:02:00.000Z", "event": {"action": "file-delete", "outcome": "success"}, "log": {"level": "info"}, "user": {"name": "alice"}, "host": {"name": "ws01"}, "file": {"path": "/home/alice/q3.xlsx"}, "message": "alice deleted /home/alice/q3.xlsx"}
  {"@timestamp": "2026-11-19T08:03:00.000Z", "event.action": "file-delete", "event.outcome": "success", "log.level": "info", "user.name": "carol", "host.name": "ws03", "file.path": "/home/carol/notes.txt", "message": "carol deleted /home/carol/notes.txt"}
  {"@timestamp": "2026-11-19T08:04:00.000Z", "event.action": "user-login", "event.outcome": "success", "log.level": "info", "user.name": "dave", "host.name": "ws04", "message": "dave signed in"}
  {"@timestamp": "2026-11-19T08:05:00.000Z", "event": {"action": "user-logout", "outcome": "success"}, "log": {"level": "info"}, "user": {"name": "alice"}, "host": {"name": "ws01"}, "message": "alice signed out"}
  {"@timestamp": "2026-11-19T08:06:00.000Z", "event.action": "user-logout", "event.outcome": "success", "log.level": "info", "user.name": "dave", "host.name": "ws04", "message": "dave signed out"}
  {"@timestamp": "2026-11-19T08:07:00.000Z", "event": {"action": "user-login", "outcome": "success"}, "log": {"level": "info"}, "user": {"name": "carol"}, "host": {"name": "ws03"}, "message": "carol signed in"}
reference:
  mapping:
    input: json
    json_layout: lines
    common:
      - {path: EventTime/TimeCreated, field: '@timestamp', time_format: "yyyy-MM-dd'T'HH:mm:ss.SSSX"}
      - {path: EventSource/System/Name, value: Endpoint Agent}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: endpoint-agent}
      - {path: EventSource/Device/HostName, xpath: "(*[@key='host']/*[@key='name'], *[@key='host.name'])[1]"}
      - {path: EventSource/User/Id, xpath: "(*[@key='user']/*[@key='name'], *[@key='user.name'])[1]"}
      - {path: EventDetail/Description, field: message}
    # Each event type recognised two ways: its nested spelling, and its flat one (a key holding dots, read by its
    # whole name).
    events:
      - name: logon
        when: [{field: event.action, equals: user-login}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-Logon}
          - {path: EventDetail/Authenticate/Data, data_name: action, field: event.action}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: user.name}
          - {path: EventDetail/Authenticate/Outcome/Success, field: event.outcome, map: {success: 'true', failure: 'false'}}
      - name: logon flat
        when: [{xpath: "*[@key='event.action']", equals: user-login}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-Logon}
          - {path: EventDetail/Authenticate/Data, data_name: action, xpath: "*[@key='event.action']"}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, xpath: "*[@key='user.name']"}
          - {path: EventDetail/Authenticate/Outcome/Success, xpath: "*[@key='event.outcome']", map: {success: 'true', failure: 'false'}}
      - name: logoff
        when: [{field: event.action, equals: user-logout}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-Logoff}
          - {path: EventDetail/Authenticate/Data, data_name: action, field: event.action}
          - {path: EventDetail/Authenticate/Action, value: Logoff}
          - {path: EventDetail/Authenticate/User/Id, field: user.name}
      - name: logoff flat
        when: [{xpath: "*[@key='event.action']", equals: user-logout}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-Logoff}
          - {path: EventDetail/Authenticate/Data, data_name: action, xpath: "*[@key='event.action']"}
          - {path: EventDetail/Authenticate/Action, value: Logoff}
          - {path: EventDetail/Authenticate/User/Id, xpath: "*[@key='user.name']"}
      - name: file delete
        when: [{field: event.action, equals: file-delete}]
        fields:
          - {path: EventDetail/TypeId, value: Delete-File}
          - {path: EventDetail/Delete/Data, data_name: action, field: event.action}
          - {path: EventDetail/Delete/Object/Type, value: File}
          - {path: EventDetail/Delete/Object/Id, field: file.path}
      - name: file delete flat
        when: [{xpath: "*[@key='event.action']", equals: file-delete}]
        fields:
          - {path: EventDetail/TypeId, value: Delete-File}
          - {path: EventDetail/Delete/Data, data_name: action, xpath: "*[@key='event.action']"}
          - {path: EventDetail/Delete/Object/Type, value: File}
          - {path: EventDetail/Delete/Object/Id, xpath: "*[@key='file.path']"}
