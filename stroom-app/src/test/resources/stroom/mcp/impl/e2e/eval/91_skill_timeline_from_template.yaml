          What each source's events mean beyond the schema, learned by earlier runs and applied before the schema's pairs and
          inference: a line each, a pair as source: pair start -> end by key, or a type's role as source: type is idle.

          ## Output

          The timeline in the chat (the activities, each label marked as an inference with its evidence; the spans by host),
          the active time by application, and the data-quality flags with examples.
  answer: >-
    I tried the skill on jsmith for the last 2 days and it built the timeline; I've proposed "User activity timeline"
    for /Investigations: review and apply it to save it.
