name: Delinea Secret Server audit events (Windows event XML fragments, the detail in a message)
template: Event Data (XML)
capabilities: [mixed_formats, field_variability]
# Cut from a user's 1,000-record sample (VS Code, Qwen): one record per category and action, the details after the
# header in each of the three separator styles (' - ', '; ', ' | '). The traps: the kind of event is inside the
# message text, so it needs extracting; the source IP and session id have elements of their own (not Data); and a
# TypeId from the category alone ('Secret') names no kind of event.
request: >
  Onboard these Delinea Secret Server audit events: Windows event XML, one <Event> per line with no root element, in
  the Windows event namespace. Each record's audit detail is the message in EventData/Data: '<time> - User: <name> -
  [[SecretServer]] Event: [<category>] Action: [<action>] By User: <domain\user> (Item Id: <n>)', then details
  (Source IP, Session Id, Ticket and others) separated by ' - ', '; ' or ' | '. The categories are User, Secret,
  Folder, Permission, Session and System. Index the events.
expected:
  records: 33
  # The clear-cut kinds only: a launch (Process or View), a failed heartbeat (Alert or Update) and the like are
  # judgement calls, not required either way.
  event_types: [Authenticate, Update, View, Create, Delete]
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/Device/HostName, EventSource/User/Id, EventDetail/TypeId]
  values:
    EventSource/Client/IPAddress: [10.20.4.18, 192.0.2.45]
    EventSource/User/Id: [joe.bloggs, riley.chen, priya.patel]
