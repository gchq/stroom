  <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="SecretServer" /><EventID>1000</EventID><Level>4</Level><Task>0</Task><Opcode>0</Opcode><Keywords>0x80000000000000</Keywords><TimeCreated SystemTime="2026-09-28T06:42:02.0000000Z" /><EventRecordID>12257</EventRecordID><Channel>Application</Channel><Computer>SecretServer.domain.com</Computer></System><EventData><Data>Sep 28 2026 06:42:02 - User: domain.com\Brown, Taylor - [[SecretServer]] Event: [User] Action: [Role Changed] By User: domain.com\taylor.brown (Item Id: 475) | Target User: domain.com\casey.wilson | Old Role: Secret User | New Role: Administrator | Request Id: REQ-1456 | Correlation Id: corr-000256</Data></EventData></Event>
reference:
  converter_type: XML_FRAGMENT
  converter: profile
  replace_parser: XMLFragmentParser
  mapping:
    input: xml_fragments
    record: Event
    xml_namespace: http://schemas.microsoft.com/win/2004/08/events/event
    extract:
    - field: EventData/Data
      regex: '^[A-Z][a-z]{2} +\d{1,2} \d{4} \d{2}:\d{2}:\d{2} - User: (.+) - \[\[SecretServer\]\] Event: \[([^\]]*)\] Action:
        \[([^\]]*)\] By User: (\S+)(?: \(Item Id: (\d+)\))?.*$'
      names:
      - msg_user
      - category
      - action
      - actor
      - item_id
    - field: EventData/Data
      regex: '^.*?Source IP: (\d{1,3}(?:\.\d{1,3}){3}).*$'
      names:
      - source_ip
    - field: EventData/Data
      regex: '^.*?Session Id: (\d+).*$'
      names:
      - session_id
    - field: EventData/Data
      regex: '^.*?Ticket: ([^\s;]+).*$'
      names:
      - ticket
    common:
    - path: EventTime/TimeCreated
      field: System/TimeCreated/@SystemTime
      time_format: yyyy-MM-dd'T'HH:mm:ss.SSSSSSSX
    - path: EventSource/System/Name
      value: Delinea Secret Server
    - path: EventSource/System/Environment
      value: Eval
    - path: EventSource/Generator
      value: Delinea Secret Server
    - path: EventSource/Device/HostName
      field: System/Computer
    - path: EventSource/User/Id
      field: actor
      transform: strip_domain
    - path: EventDetail/Description
      field: EventData/Data
    - path: EventSource/Client/IPAddress
      field: source_ip
    - path: EventSource/SessionId
      field: session_id
    - path: EventDetail/TypeId
      field: action
    events:
    - name: auth
      when:
      - field: category
        equals: User
      - field: action
        one_of:
        - Login
        - Login Failed
        - Logout
        - MFA Challenge
        - Account Locked
      fields:
      - path: EventDetail/Authenticate/Action
        field: action
        map:
          Account Locked: AccountLock
          Login: Logon
          Login Failed: Logon
          Logout: Logoff
          MFA Challenge: Other
        default: Other
      - path: EventDetail/Authenticate/User/Id
        field: actor
      - path: EventDetail/Authenticate/User/Name
        field: msg_user
      - path: EventDetail/Authenticate/Data
        field: action
        data_name: action
      - path: EventDetail/Authenticate/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/Authenticate/Data
        field: ticket
        data_name: ticket
    - name: user-admin
      when:
      - field: category
        equals: User
      - field: action
        one_of:
        - Role Changed
        - Password Reset
      fields:
      - path: EventDetail/Update/After/Object/Type
        field: category
      - path: EventDetail/Update/After/Object/Id
        field: item_id
      - path: EventDetail/Update/Data
        field: action
        data_name: action
      - path: EventDetail/Update/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/Update/Data
        field: ticket
        data_name: ticket
    - name: secret-view
      when:
      - field: category
        equals: Secret
      - field: action
        one_of:
        - View
        - Password Displayed
        - Copy Password
        - Checkout
        - Checkin
        - Export
      fields:
      - path: EventDetail/View/Object/Type
        field: category
      - path: EventDetail/View/Object/Id
        field: item_id
      - path: EventDetail/View/Data
        field: action
        data_name: action
      - path: EventDetail/View/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/View/Data
        field: ticket
        data_name: ticket
    - name: secret-create
      when:
      - field: category
        equals: Secret
      - field: action
        equals: Create
      fields:
      - path: EventDetail/Create/Object/Type
        field: category
      - path: EventDetail/Create/Object/Id
        field: item_id
      - path: EventDetail/Create/Data
        field: action
        data_name: action
      - path: EventDetail/Create/Data
        field: item_id
        data_name: item_id
    - name: secret-update
      when:
      - field: category
        equals: Secret
      - field: action
        one_of:
        - Edit
        - Restore
        - Password Changed
      fields:
      - path: EventDetail/Update/After/Object/Type
        field: category
      - path: EventDetail/Update/After/Object/Id
        field: item_id
      - path: EventDetail/Update/Data
        field: action
        data_name: action
      - path: EventDetail/Update/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/Update/Data
        field: ticket
        data_name: ticket
    - name: secret-delete
      when:
      - field: category
        equals: Secret
      - field: action
        equals: Delete
      fields:
      - path: EventDetail/Delete/Object/Type
        field: category
      - path: EventDetail/Delete/Object/Id
        field: item_id
      - path: EventDetail/Delete/Data
        field: action
        data_name: action
      - path: EventDetail/Delete/Data
        field: item_id
        data_name: item_id
    - name: secret-alert
      when:
      - field: category
        equals: Secret
      - field: action
        one_of:
        - Access Denied
        - Password Change Failed
        - Heartbeat Failed
      fields:
      - path: EventDetail/Alert/Type
        field: action
        map:
          Access Denied: Other
          Heartbeat Failed: Error
          Password Change Failed: Error
        default: Other
      - path: EventDetail/Alert/Data
        field: action
        data_name: action
      - path: EventDetail/Alert/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/Alert/Data
        field: ticket
        data_name: ticket
    - name: secret-launch
      when:
      - field: category
        equals: Secret
      - field: action
        equals: Launch
      fields:
      - path: EventDetail/Process/Action
        value: Execute
      - path: EventDetail/Process/Type
        value: Application
      - path: EventDetail/Process/Command
        field: action
      - path: EventDetail/Process/Data
        field: action
        data_name: action
      - path: EventDetail/Process/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/Process/Data
        field: ticket
        data_name: ticket
    - name: folder-create
      when:
      - field: category
        equals: Folder
      - field: action
        equals: Create
      fields:
      - path: EventDetail/TypeId
        value: Folder Create
      - path: EventDetail/Create/Object/Type
        field: category
      - path: EventDetail/Create/Object/Id
        field: item_id
      - path: EventDetail/Create/Data
        field: action
        data_name: action
      - path: EventDetail/Create/Data
        field: item_id
        data_name: item_id
    - name: folder-update
      when:
      - field: category
        equals: Folder
      fields:
      - path: EventDetail/Update/After/Object/Type
        field: category
      - path: EventDetail/Update/After/Object/Id
        field: item_id
      - path: EventDetail/Update/Data
        field: action
        data_name: action
      - path: EventDetail/Update/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/Update/Data
        field: ticket
        data_name: ticket
    - name: permission
      when:
      - field: category
        equals: Permission
      fields:
      - path: EventDetail/Update/After/Object/Type
        field: category
      - path: EventDetail/Update/After/Object/Id
        field: item_id
      - path: EventDetail/Update/Data
        field: action
        data_name: action
      - path: EventDetail/Update/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/Update/Data
        field: ticket
        data_name: ticket
    - name: session
      when:
      - field: category
        equals: Session
      fields:
      - path: EventDetail/Process/Action
        field: action
        map:
          End: Shutdown
          Recording Viewed: Access
          Start: Startup
        default: Execute
      - path: EventDetail/Process/Type
        value: Application
      - path: EventDetail/Process/Command
        field: action
      - path: EventDetail/Process/Data
        field: action
        data_name: action
      - path: EventDetail/Process/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/Process/Data
        field: ticket
        data_name: ticket
    - name: system-config
      when:
      - field: category
        equals: System
      - field: action
        equals: Configuration Changed
      fields:
      - path: EventDetail/Update/After/Object/Type
        field: category
      - path: EventDetail/Update/After/Object/Id
        field: item_id
      - path: EventDetail/Update/Data
        field: action
        data_name: action
      - path: EventDetail/Update/Data
        field: item_id
        data_name: item_id
      - path: EventDetail/Update/Data
        field: ticket
        data_name: ticket
    - name: system-job
      when:
      - field: category
        equals: System
      fields:
      - path: EventDetail/Process/Action
        value: Execute
      - path: EventDetail/Process/Type
        value: Application
      - path: EventDetail/Process/Command
        field: action
      - path: EventDetail/Process/Data
        field: action
        data_name: action
      - path: EventDetail/Process/Data
        field: item_id
        data_name: item_id
    - name: other
      fields:
      - path: EventDetail/Unknown/Data
        field: category
        data_name: Category
      - path: EventDetail/Unknown/Data
        field: action
        data_name: Action
      - path: EventDetail/Unknown/Data
        field: item_id
        data_name: ItemId
      allow_unknown: Records whose Event category is none of User/Secret/Folder/Permission/Session/System, or whose action
        matches no rule above. None are expected in this sample; kept as Unknown with category/action/item id so nothing is
        silently dropped.
