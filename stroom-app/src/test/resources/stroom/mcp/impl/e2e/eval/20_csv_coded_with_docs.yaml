name: Acme directory
template: Event Data (Text)
capabilities: [field_normalization]
request: >
  Onboard the Acme directory's audit log below (CSV with a header). The codes in it are the vendor's own: their
  reference documentation is attached. Index the events so analysts can search by user and by whether a logon
  worked.
# The vendor's documentation: without it the codes say nothing (run_agent.py --without-source-docs measures that).
source_docs: |
  # Acme directory 9 audit log reference

  Each line is one audited operation. Columns:

  | Column | Meaning |
  | --- | --- |
  | ts | When the operation completed (UTC, ISO 8601) |
  | host | The directory server that wrote the line |
  | evt | Operation code, see Operations |
  | usr | The account the operation is about |
  | src | The client workstation's IP address |
  | res | Result code, see Results |

  ## Operations

  | evt | Operation |
  | --- | --- |
  | A17 | Account logged on |
  | A18 | Account failed to log on |
  | A40 | Account logged off |

  ## Results

  | res | Result |
  | --- | --- |
  | R0 | Success |
  | R7 | Failure: wrong password |
  | R9 | Failure: account locked out |
expected:
  records: 4
  event_types: [Authenticate]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventSource/Client/IPAddress, EventDetail/Authenticate/Action,
          EventDetail/Authenticate/Outcome/Success]
  # Only the documentation says A18 is a failed logon and A40 a logoff.
  values:
    EventDetail/Authenticate/Action: [Logon, Logoff]
    EventDetail/Authenticate/Outcome/Success: ['true', 'false']
sample: |
  ts,host,evt,usr,src,res
  2026-10-01T08:00:00Z,dir01,A17,alice,10.0.0.1,R0
  2026-10-01T08:05:00Z,dir01,A18,bob,10.0.0.2,R7
  2026-10-01T08:10:00Z,dir01,A40,alice,10.0.0.1,R0
  2026-10-01T08:12:00Z,dir01,A18,carol,10.0.0.3,R9
reference:
  converter: csv_header
  mapping:
    input: data_splitter
    common:
      - {path: EventTime/TimeCreated, field: ts, time_format: "yyyy-MM-dd'T'HH:mm:ssXXX"}
      - {path: EventSource/System/Name, value: Acme directory}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: acme-directory}
      - {path: EventSource/Device/HostName, field: host}
      - {path: EventSource/Client/IPAddress, field: src}
      - {path: EventSource/User/Id, field: usr}
      - {path: EventDetail/TypeId, field: evt}
      - {path: EventDetail/Authenticate/User/Id, field: usr}
      - {path: EventDetail/Authenticate/Outcome/Success, field: res, map: {R0: "true", R7: "false", R9: "false"}}
    events:
      - name: logon
        when: [{field: evt, one_of: [A17, A18]}]
        fields: [{path: EventDetail/Authenticate/Action, value: Logon}]
      - name: logoff
        when: [{field: evt, equals: A40}]
        fields: [{path: EventDetail/Authenticate/Action, value: Logoff}]
