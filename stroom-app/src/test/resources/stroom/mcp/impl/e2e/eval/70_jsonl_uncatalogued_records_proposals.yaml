name: Identity provider, a later stream with records the promoted catalogue does not recognise (JSON lines)
template: Event Data (JSON)
capabilities: [schema_variation, event_types, lifecycle]
# The lifecycle after the first build: case 30's build is promoted (its catalogue with it, in its source notes), then
# the IdP's new release writes a third shape of record, MFA challenges (evt, at, who, factor, result), beside the old
# shapes. The catch-all catches them in processing; review_coverage groups them by shape and proposes an event type;
# the user confirms it, and a new version of the translation recognises them. The traps: the new records left as
# Unknown, the promoted catalogue started over rather than carried, or the promoted XSLT changed in place.
setup: {from_case: 30}
request: >
  Our identity provider's sign-in log is onboarded already (its feed and translation are promoted). Since the IdP's
  upgrade, its log has a new kind of record, second-factor challenges, which come out as unknown events. Catalogue
  them and translate them in a new version, keeping everything that is translated already.
user_knows: >
  The new records (evt, at, who, factor, result) are second-factor (MFA) challenges: evt mfa.verify, result pass or
  fail. They are one new event type. The event types already catalogued stay as they are.
expected:
  records: 8
  event_types: [Authenticate]
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventDetail/Authenticate/Action, EventDetail/Description]
  values:
    EventSource/User/Id: [alice, erin, frank]
  type_ids:
    min_distinct: 3
    same:
      - [{evt: mfa.verify}]
  unknown_at_most: 0
  # The catalogue grew: the promoted build's event types, and the new one.
  catalogue: {catch_all_confirmed: true, no_overlaps: true, event_types_at_least: 5}
# The IdP's later stream, in the feed before the case's build starts (stored once the setup is built and promoted):
# old shapes beside the new one.
later_sample: |
  {"eventType": "user.session.start", "published": "2026-10-09T08:00:00.000Z", "actor": {"alternateId": "alice@example.org"}, "client": {"ipAddress": "10.0.0.5"}, "outcome": {"result": "SUCCESS"}}
  {"evt": "mfa.verify", "at": "2026-10-09T08:00:04Z", "who": "alice", "factor": "push", "result": "pass"}
  {"type": "login", "ts": "2026-10-09T08:01:00Z", "user": "erin", "ip": "10.0.0.8", "ok": true}
  {"evt": "mfa.verify", "at": "2026-10-09T08:01:05Z", "who": "erin", "factor": "totp", "result": "fail"}
  {"evt": "mfa.verify", "at": "2026-10-09T08:01:40Z", "who": "erin", "factor": "totp", "result": "pass"}
  {"eventType": "user.session.start", "published": "2026-10-09T08:04:50.000Z", "actor": {"alternateId": "frank@example.org"}, "client": {"ipAddress": "203.0.113.20"}, "outcome": {"result": "FAILURE", "reason": "INVALID_CREDENTIALS"}}
  {"evt": "mfa.verify", "at": "2026-10-09T08:05:00Z", "who": "frank", "factor": "sms", "result": "pass"}
  {"type": "logout", "ts": "2026-10-09T09:00:00Z", "user": "erin", "ip": "10.0.0.8", "ok": true}
reference:
  mapping:
    input: json
    json_layout: lines
    common:
      - {path: EventSource/System/Name, value: Identity Provider}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: idp}
      - {path: EventSource/Device/HostName, value: idp.example.org}
    events:
      # The new shape: eventType names what happened.
      - name: new session start
        when: [{field: eventType, equals: user.session.start}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-Logon}
          - {path: EventDetail/Description, value: "A user signed in, or tried to"}
          - {path: EventDetail/Authenticate/Data, data_name: eventType, field: eventType}
          - {path: EventTime/TimeCreated, field: published, time_format: "yyyy-MM-dd'T'HH:mm:ss.SSSX"}
          - {path: EventSource/User/Id, field: actor.alternateId, transform: strip_domain}
          - {path: EventSource/User/Domain, field: actor.alternateId, transform: domain}
          - {path: EventSource/Client/IPAddress, field: client.ipAddress}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: actor.alternateId, transform: strip_domain}
          - {path: EventDetail/Authenticate/User/Domain, field: actor.alternateId, transform: domain}
          - {path: EventDetail/Authenticate/Outcome/Success, field: outcome.result, map: {SUCCESS: 'true', FAILURE: 'false'}}
          - {path: EventDetail/Authenticate/Outcome/Description, field: outcome.reason}
      - name: new session end
        when: [{field: eventType, equals: user.session.end}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-Logoff}
          - {path: EventDetail/Description, value: A user signed out}
          - {path: EventDetail/Authenticate/Data, data_name: eventType, field: eventType}
          - {path: EventTime/TimeCreated, field: published, time_format: "yyyy-MM-dd'T'HH:mm:ss.SSSX"}
          - {path: EventSource/User/Id, field: actor.alternateId, transform: strip_domain}
          - {path: EventSource/User/Domain, field: actor.alternateId, transform: domain}
          - {path: EventSource/Client/IPAddress, field: client.ipAddress}
          - {path: EventDetail/Authenticate/Action, value: Logoff}
          - {path: EventDetail/Authenticate/User/Id, field: actor.alternateId, transform: strip_domain}
          - {path: EventDetail/Authenticate/User/Domain, field: actor.alternateId, transform: domain}
      - name: new account lock
        when: [{field: eventType, equals: user.account.lock}]
        fields:
          - {path: EventDetail/TypeId, value: Lock-UserAccount}
          - {path: EventDetail/Description, value: An account was locked}
          - {path: EventDetail/Authenticate/Data, data_name: eventType, field: eventType}
          - {path: EventTime/TimeCreated, field: published, time_format: "yyyy-MM-dd'T'HH:mm:ss.SSSX"}
          - {path: EventSource/User/Id, field: actor.alternateId, transform: strip_domain}
          - {path: EventSource/User/Domain, field: actor.alternateId, transform: domain}
          - {path: EventSource/Client/IPAddress, field: client.ipAddress}
          - {path: EventDetail/Authenticate/Action, value: AccountLock}
          - {path: EventDetail/Authenticate/User/Id, field: actor.alternateId, transform: strip_domain}
          - {path: EventDetail/Authenticate/User/Domain, field: actor.alternateId, transform: domain}
      # The legacy shape: type names what happened, ok whether it worked.
      - name: legacy login
        when: [{field: type, equals: login}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-Logon}
          - {path: EventDetail/Description, value: "A user signed in, or tried to"}
          - {path: EventDetail/Authenticate/Data, data_name: type, field: type}
          - {path: EventTime/TimeCreated, field: ts, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
          - {path: EventSource/User/Id, field: user}
          - {path: EventSource/Client/IPAddress, field: ip}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: user}
          - {path: EventDetail/Authenticate/Outcome/Success, field: ok}
      - name: legacy logout
        when: [{field: type, equals: logout}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-Logoff}
          - {path: EventDetail/Description, value: A user signed out}
          - {path: EventDetail/Authenticate/Data, data_name: type, field: type}
          - {path: EventTime/TimeCreated, field: ts, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
          - {path: EventSource/User/Id, field: user}
          - {path: EventSource/Client/IPAddress, field: ip}
          - {path: EventDetail/Authenticate/Action, value: Logoff}
          - {path: EventDetail/Authenticate/User/Id, field: user}
      - name: legacy password change
        when: [{field: type, equals: password_change}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-PasswordChange}
          - {path: EventDetail/Description, value: A user changed their password}
          - {path: EventDetail/Authenticate/Data, data_name: type, field: type}
          - {path: EventTime/TimeCreated, field: ts, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
          - {path: EventSource/User/Id, field: user}
          - {path: EventSource/Client/IPAddress, field: ip}
          - {path: EventDetail/Authenticate/Action, value: ChangePassword}
          - {path: EventDetail/Authenticate/User/Id, field: user}
          - {path: EventDetail/Authenticate/Outcome/Success, field: ok}
      # Uncatalogued in the promoted build: the MFA records of the IdP's new release, now an event type.
      - name: mfa verify
        when: [{field: evt, equals: mfa.verify}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-MFA}
          - {path: EventDetail/Description, value: A user answered a second-factor challenge}
          - {path: EventDetail/Authenticate/Data, data_name: evt, field: evt}
          - {path: EventTime/TimeCreated, field: at, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
          - {path: EventSource/User/Id, field: who}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: who}
          - {path: EventDetail/Authenticate/Outcome/Success, field: result, map: {pass: 'true', fail: 'false'}}
          - {path: EventDetail/Authenticate/Data, data_name: factor, field: factor}
