name: VPN logons from two exports that differ
template: Event Data (Text)
capabilities: [format_evolution, schema_variation]
request: >
  Onboard these VPN logs. We have two exports from different appliance versions: the older one has columns
  time, user, action, result, src_ip; the newer one renamed the first two to timestamp and username, added a
  device column, and has a new action, timeout, which should count as a logoff. Build one pipeline that handles
  both and index the events.
expected:
  records: 6
  event_types: [Authenticate]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventSource/Client/IPAddress, EventDetail/Authenticate/Action]
samples:
  - |
    time,user,action,result,src_ip
    2026-10-01T08:00:00Z,alice,login,ok,203.0.113.10
    2026-10-01T08:30:00Z,bob,login,fail,203.0.113.11
    2026-10-01T09:00:00Z,alice,logout,ok,203.0.113.10
  - |
    timestamp,username,action,result,src_ip,device
    2026-10-02T08:00:00Z,carol,login,ok,203.0.113.12,vpn-gw-2
    2026-10-02T08:45:00Z,carol,timeout,ok,203.0.113.12,vpn-gw-2
    2026-10-02T09:00:00Z,dave,login,fail,203.0.113.13,vpn-gw-2
reference:
  converter: csv_header
  splitter: {kind: delimited, delimiter: ",", header: true}
  mapping:
    input: data_splitter
    common:
      - {path: EventTime/TimeCreated, any_of: [time, timestamp], time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
      - {path: EventSource/System/Name, value: Acme VPN}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: vpnd}
      - {path: EventSource/Device/HostName, field: device, default: vpn-gw-1}
      - {path: EventSource/Client/IPAddress, field: src_ip}
      - {path: EventSource/User/Id, any_of: [user, username]}
      - {path: EventDetail/Authenticate/User/Id, any_of: [user, username]}
    events:
      - name: logon
        when: [{field: action, equals: login}]
        fields:
          - {path: EventDetail/TypeId, value: VPN-Logon}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/Outcome/Success, field: result, map: {ok: "true", fail: "false"}}
      - name: logoff
        when: [{field: action, one_of: [logout, timeout]}]
        fields:
          - {path: EventDetail/TypeId, field: action, map: {logout: VPN-Logoff, timeout: VPN-Timeout}}
          - {path: EventDetail/Authenticate/Action, value: Logoff}
