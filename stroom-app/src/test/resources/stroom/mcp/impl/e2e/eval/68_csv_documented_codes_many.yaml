name: ERP audit log of some 300 documented codes, 120 of them in the sample (CSV with a header)
template: Event Data (Text)
capabilities: [field_normalization, source_docs, event_types]
# The vendor documents 300 operation codes (30 objects, ten operations each); the sample (made by EvalSamples'
# documented_codes generator, pinned in generated-sha256.json) holds 120 of them. Each documented code is an event
# type, its Description the documentation's text: the 180 not in the sample are event types from the documentation
# all the same, said to be not in the sample, never dropped. Run alone: 300 event types are a lot to propose, check
# and confirm. The traps: only the sampled codes catalogued; the code itself as TypeId; forms of 300 rows.
request: >
  Onboard our ERP system's audit log (a CSV file with a header on my disk). Each line's code is the vendor's
  operation code: their reference documentation is attached, and lists every code. Catalogue every documented code,
  including those not in the sample, and index the events.
user_knows: >
  The codes are the vendor's: the documentation's table says what each means, object and operation. Every documented
  code is an event type, whether or not the sample has it. user is who did it, object_id what it was done to. The
  system is Acme ERP.
source_docs: |
  # Acme ERP audit log reference

  Each line is one audited operation. Columns: time (UTC, ISO 8601), host (the ERP server), code (the operation, see
  Operations), user (the account that did it), object_id (what it was done to).

