expected:
  records: 360
  event_types: [Create, Delete, View, Update]
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventDetail/TypeId, EventDetail/Description]
  type_ids: {min_distinct: 100}
  unknown_at_most: 0
  # The 180 documented codes not in the sample: event types from the documentation, not dropped.
  catalogue: {catch_all_confirmed: true, no_overlaps: true, documentation_only: 150}
files:
  - {name: erp-audit-2026-10-11.csv, generate: {kind: documented_codes, records: 360, seed: 68, codes_sampled: 120}}
reference:
  converter: csv_header
  # Every event type is the documentation's.
  catalogue: {basis: documentation}
  mapping:
    input: data_splitter
    common:
      - {path: EventTime/TimeCreated, field: time, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
      - {path: EventSource/System/Name, value: Acme ERP}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: acme-erp}
      - {path: EventSource/Device/HostName, field: host}
      - {path: EventSource/User/Id, field: user}
    events:
      - name: account created
        when: [{field: code, equals: EV1000}]
        fields:
          - {path: EventDetail/TypeId, value: Create-Account}
          - {path: EventDetail/Description, value: Account created}
          - {path: EventDetail/Create/Data, data_name: code, field: code}
          - {path: EventDetail/Create/Object/Type, value: Account}
          - {path: EventDetail/Create/Object/Id, field: object_id}
      - name: account deleted
        when: [{field: code, equals: EV1001}]
