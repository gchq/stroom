name: A logon then an export within 5 minutes, on an Elasticsearch index (a question, nothing built)
kind: question
capabilities: [sequence, elasticsearch, eql]
# Case 73's question on the same events in Elasticsearch (questions/staff-activity.csv), behind the Elastic Index doc
# "Staff activity": sequence_query runs it as EQL there. No user has two logons or two exports within 5 minutes of
# each other, so EQL's sequences (each event in one sequence) are the windowed join's pairs. The traps are case 73's.
# Skipped without an Elasticsearch node. Worked out by brute force over the file (TestEvalCases).
elastic_index:
  name: Staff activity
  events: questions/staff-activity.csv
  fields: {EventTime: date, UserId: text, Action: text, Files: long}
request: >
  Who logged on and then exported files within 5 minutes, in the week starting Monday 5 January 2026? Use the "Staff
  activity" Elasticsearch index. Give each user with the time of the logon and of the export.
user_knows: >
  UserId is the user, Action is Logon for a logon and Export for an export, and EventTime is when it happened. The
  export must be by the same user, at most 5 minutes after the logon. The week is 5 January 2026 00:00 UTC up to,
  not including, 12 January 2026.
expected:
  tools_used: [sequence_query]
  answer:
    tool: sequence_query
    ordered: false
    result: {engine: EQL}
    rows:
      - [alice, '2026-01-06T09:00:00.000Z', '2026-01-06T09:03:00.000Z']
      - [carol, '2026-01-07T14:00:00.000Z', '2026-01-07T14:04:30.000Z']
      - [harry, '2026-01-08T08:30:00.000Z', '2026-01-08T08:31:15.000Z']
reference:
  sequence_query:
    steps:
      - {index: Staff activity, by: [UserId], where: [{field: Action, value: Logon}]}
      - {index: Staff activity, by: [UserId], where: [{field: Action, value: Export}]}
    maxspan: 5m
    timeFrom: '2026-01-05T00:00:00.000Z'
    timeTo: '2026-01-12T00:00:00.000Z'
