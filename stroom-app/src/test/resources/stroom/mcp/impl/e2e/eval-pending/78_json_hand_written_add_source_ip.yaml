name: VPN audit translated by a hand-written pipeline, the source IP added in a new version (JSON array)
template: Event Data (JSON)
capabilities: [lifecycle, event_types, hand_written]
# Kept apart from eval/ (not in EvalCases.IDS): the reference runner sets a case up only from another case's
# reference build (setup: {from_case: N}), which the tools build. This case needs a feed whose pipeline was written by
# hand in Stroom and never built by the tools (setup: {hand_written: ...} below), which the runner doesn't make yet;
# TestE2eStartFromExistingPipeline makes the same setup directly in Stroom and walks the reference route.
#
# The feed is translated now by a hand-written pipeline: a template per event, matched by patterns on the record
# (stroom-app's test resource hand_written_vpn.xsl). The user asks for the source IP, which it doesn't translate. The
# plan offers, after the survey, to start from the existing pipeline: the right route copies it as a new version,
# reads its XSLT back into a mapping and catalogue (rebuild_mapping, proven against the original on the feed's
# records), confirms the catalogue read back, then adds the one field. The traps: drafting the translation from
# scratch (event types renamed, the heartbeat no longer dropped, settings written differently), the catalogue copied
# by hand, or the promoted XSLT changed in place.
setup:
  hand_written:
    feed: EVAL-78
    xslt: hand_written_vpn.xsl
    pipeline: EVAL-78-Events
    template: Event Data (JSON)
    properties: [{element: jsonParser, name: addRootObject, value: false}]
    processor_filter: {stream_type: Raw Events}
    sample: |
      [{"ts": "2026-11-03T08:00:01.000Z", "action": "login", "user": "jbloggs", "src_ip": "198.51.100.7", "host": "vpn-gw-1", "result": "success"},
       {"ts": "2026-11-03T08:02:45.000Z", "action": "login", "user": "asmith", "src_ip": "198.51.100.9", "host": "vpn-gw-1", "result": "failure"},
       {"ts": "2026-11-03T12:10:00.000Z", "action": "logout", "user": "jbloggs", "src_ip": "198.51.100.7", "host": "vpn-gw-1"},
       {"ts": "2026-11-03T09:30:00.000Z", "action": "config_change", "user": "admin", "host": "vpn-gw-1", "setting": "idle_timeout", "new_value": "900"},
       {"ts": "2026-11-03T09:31:00.000Z", "action": "heartbeat", "host": "vpn-gw-1"}]
request: >
  Our VPN's audit feed, EVAL-78, is translated by a pipeline someone wrote by hand years ago. Add the source IP address
  to its translation, and change nothing else.
user_knows: >
  src_ip is the address the user connected from. Everything the pipeline translates now is right and stays as it is;
  heartbeats are left untranslated on purpose. Start from the existing pipeline when asked.
expected:
  # Inducting, not drafting: the offer taken, the pipeline copied and read back, never drafted from the sample.
  route:
    start_from: existing
    calls_in_order: [survey_feed, catalogue_event_types, copy_pipeline, rebuild_mapping, catalogue_event_types,
                     build_translation_xslt, promote_build]
    forbidden_calls: [draft_translation_mapping]
  records: 4
  event_types: [Authenticate, Update]
  forbidden_types: [Unknown]
  # V1.1 writes what V1.0 writes for every record, the new field aside.
  same_as_setup_except: [EventSource/Client/IPAddress]
  paths: [EventSource/Client/IPAddress]
  values:
    EventSource/Client/IPAddress: [198.51.100.7, 198.51.100.9]
  type_ids:
    exactly: [vpn-login, vpn-login-failed, vpn-logout, vpn-config-change]
  catalogue: {catch_all_confirmed: true, event_types_at_least: 4, origin: EVAL-78-Events}
  promoted: {pipeline: EVAL-78-Events-V1.1, original_unchanged: true}
reference:
  # The route an agent following next takes (the reference runner would make these calls in turn).
  calls:
    - {tool: start_build, arguments: {build: eval-78, feeds: [EVAL-78]}}
    - {tool: survey_feed, arguments: {feed: EVAL-78, build: eval-78}}
    - {tool: catalogue_event_types, arguments: {build: eval-78}, answer: Start from the existing pipeline (recommended)}
    - {tool: copy_pipeline, arguments: {build: eval-78, source_uuid: <EVAL-78-Events>, new_name: EVAL-78-Events-V1.1}}
    - {tool: rebuild_mapping, arguments: {uuid: <the copy's XSLT>, pipeline_uuid: <the copy>}}
    - {tool: catalogue_event_types, arguments: {build: eval-78, confirm: true}}
    - {tool: build_translation_xslt, arguments: {uuid: <the copy's XSLT>, changes: {common: [{path: EventSource/Client/IPAddress, field: src_ip}]}}}
    - {tool: step_sample, arguments: {pipeline_uuid: <the copy>}}
    - {tool: write_documentation, arguments: {build: eval-78, pipeline_uuid: <the copy>}}
    - {tool: promote_build, arguments: {build: eval-78}}
