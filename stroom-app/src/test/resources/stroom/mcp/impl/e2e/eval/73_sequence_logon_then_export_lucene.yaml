name: A logon then an export within 5 minutes, on a Lucene index (a question, nothing built)
kind: question
capabilities: [sequence, stroomql, windowed_join]
# A two-step sequence on the Lucene index "Staff activity" (questions/staff-activity.csv): a user's logon followed by
# an export by the same user within 5 minutes. sequence_query runs it in Stroom as a StroomQL windowed join, as the
# index isn't an Elastic Index. The traps: bob's export 2 minutes before his logon; erin's export 6 minutes after
# hers; erin's export 2 minutes after gina's logon (another user); ivan's and gina's pairs outside the week; the pairs
# matched by hand from two searches. Worked out by brute force over the file (TestEvalCases).
lucene_index:
  name: Staff activity
  events: questions/staff-activity.csv
  fields: {EventTime: date, UserId: text, Action: text, Files: long}
request: >
  Who logged on and then exported files within 5 minutes, in the week starting Monday 5 January 2026? Use the "Staff
  activity" index. Give each user with the time of the logon and of the export.
user_knows: >
  UserId is the user, Action is Logon for a logon and Export for an export, and EventTime is when it happened. The
  export must be by the same user, at most 5 minutes after the logon. The week is 5 January 2026 00:00 UTC up to,
  not including, 12 January 2026.
expected:
  tools_used: [sequence_query]
  answer:
    tool: sequence_query
    ordered: false
    result: {engine: StroomQL}
    rows:
      - [alice, '2026-01-06T09:00:00.000Z', '2026-01-06T09:03:00.000Z']
      - [carol, '2026-01-07T14:00:00.000Z', '2026-01-07T14:04:30.000Z']
      - [harry, '2026-01-08T08:30:00.000Z', '2026-01-08T08:31:15.000Z']
reference:
  sequence_query:
    steps:
      - {index: Staff activity, by: [UserId], where: [{field: Action, value: Logon}]}
      - {index: Staff activity, by: [UserId], where: [{field: Action, value: Export}]}
    maxspan: 5m
    timeFrom: '2026-01-05T00:00:00.000Z'
    timeTo: '2026-01-12T00:00:00.000Z'
