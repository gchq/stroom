name: Case 114's day of property-site visits, from an index a build made (its index plan maps the fields), the model naming no field (a chat)
kind: chat
capabilities: [timeline, elasticsearch, levels, characterise]
# Case 114 with the index plan an onboarding build keeps beside the indexing XSLT of the pipeline feeding the
# index (index_plans: UserName from EventSource/User/Id, Host from EventSource/Device/HostName, EventCode from
# EventDetail/TypeId, Object from EventDetail/View/Resource/URL), as an index Stroom built has: the reference names
# only the index and its codes' roles, and every field the timeline reads comes from the plan (asked for by the user
# 2026-11-27: in cases 113 to 115, indexes with no plan, Haiku and Sonnet named few or none of the fields). Run on a
# model, it shows whether the fields are still missed where a build mapping exists.
# One person's day (lchen, 18 November 2026) in one Elasticsearch index "Web and documents", made by
# EvalTimelineScenes (scene property_sites): in the afternoon, web requests (EventCode web.get, Object the URL,
# Category the proxy's category) to three property listing sites visited by turns; in the morning and late
# afternoon, edits (doc.edit) of a budget workbook and a board report. Run in Stroom's chat, where the levels'
# side calls go to the chat's model (scripted in the reference, side_answers): code merges the three sites' visits
# as one theme by their category (Category, a field the timeline fetches by its name), so the model has no chain
# of theirs to join. Scored on activity-levels.csv and events.csv: a level-2 thematic span made in code by the
# category, holding exactly the visits' requests, the visits (a span each) its children; and the
# follow-up, which events make it up (asked in the request: the harness's follow_up is said only in a question's
# run over MCP, which has no side calls), answered from events.csv's membership columns (merged): exactly them.
# The traps: three sites read as three things done, the document work taken into the theme, the other person's
# visits, and listing the afternoon's events by time rather than by membership. Skipped without an Elasticsearch
# node.
elastic_index:
  name: Web and documents
  generate: {kind: timeline_scenes, scene: property_sites, seed: 114}
  fields: {EventTime: date, Source: text, UserName: text, Host: text, EventCode: text, Object: text,
           Category: text}
index_plans:
  - index: Web and documents
    pipeline: Web and documents indexing
    fields:
      - {name: UserName, type: keyword, source: EventSource/User/Id}
      - {name: EventTime, type: date, source: EventTime/TimeCreated}
      - {name: Host, type: keyword, source: EventSource/Device/HostName}
      - {name: EventCode, type: keyword, source: EventDetail/TypeId}
      - {name: Object, type: keyword, source: EventDetail/View/Resource/URL}
request: >
  What was lchen doing on 18 November 2026? Build their activity timeline from the "Web and documents"
  Elasticsearch index, with what they were working on. Then list exactly the events that make up their real-estate
  browsing, with each one's StreamId and EventId.
user_knows: >
  Source says which product wrote each event: proxy (EventCode web.get, Object the URL, Category the proxy's
  category) and endpoint (EventCode doc.edit, Object the document). The day is 18 November 2026 00:00 UTC up to,
  not including, 19 November 2026. Characterise with the model.
expected:
  tools_used: [activity_timeline]
  # Scored on activity-levels.csv and events.csv (EvalTimelineScore), never on the model's wording.
  timeline:
    entity: lchen
    theme: {matches: 'homes\.example\.com\.au|propertyfinder\.example\.net|rentals\.example\.org', level: 2,
            exactly: true, children_at_least: 9, how: '^code: sharing category real estate'}
    members_answer: true
reference:
  calls:
    - {tool: activate_timelines, arguments: {}}
    - tool: activity_timeline
      arguments:
        entity: lchen
        timeFrom: '2026-11-18T00:00:00.000Z'
        timeTo: '2026-11-19T00:00:00.000Z'
        timeZone: UTC
        view: activities
        sources:
          # No field named: the plan maps each.
          - {index: Web and documents, typeRoles: {web.get: action, doc.edit: action}}
    # The theme code merged by the category: its id from activity-levels.csv, then its events by membership.
    - tool: table
      arguments:
        path: /outputs/timelines/lchen/activity-levels.csv
        where: [{column: level, op: '=', value: '2'}, {column: how, op: starts_with, value: 'code: sharing category'}]
        select: [id, bar_label, how]
    - tool: table
      arguments:
        path: /outputs/timelines/lchen/events.csv
        where: [{column: merged, op: '=', value: '<result:\|\s*(m\d+)\s*\|>'}]
        select: [time, object, StreamId, EventId]
  side_answers:
    # Only the document work's chain is asked: the sites' visits are one theme in code, by their category.
    - contains: [You group a user's timeline]
      answer: >-
        [{"id": "c1", "answer": "separate", "confidence": "high", "evidence": ["q4 budget forecast"]}]
  answer: >-
    lchen worked on the Q4 budget forecast and the November board report in the morning, and in the afternoon
    browsed three property listing sites by turns (one theme); the events making it up are listed above.
