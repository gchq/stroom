name: Uploads per day per site domain over two days, on an Elasticsearch index (a question, nothing built)
kind: question
capabilities: [elasticsearch, esql, aggregation, time_buckets]
# The proxy upload events of case 62. The answer is time-bucketed: a time range on @timestamp (the tool's
# timeFrom/timeTo, or a WHERE), then STATS COUNT and SUM BY a day bucket (BUCKET or DATE_TRUNC) and the domain. The
# traps: the days off by one at the range's ends (the 4th included, or the 2nd left out); days bucketed in a time
# zone other than UTC; every event read through run_stroomql to be grouped in Stroom.
elastic_index: {name: Proxy uploads}
request: >
  For each site domain, how many uploads were there, and how many bytes uploaded, on each day from 2 January 2026 to
  3 January 2026 inclusive (UTC)? Use the "Proxy uploads" Elasticsearch index.
user_knows: >
  The index is "Proxy uploads". url.domain is the site domain, http.request.bytes the size of each upload in bytes,
  @timestamp when it was made (UTC). Every upload counts, allowed or blocked. Days are UTC days.
expected:
  tools_used: [esql_query]
  answer:
    ordered: false
