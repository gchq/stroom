reference:
  esql_query:
    timeFrom: "2026-01-02T00:00:00.000Z"
    timeTo: "2026-01-04T00:00:00.000Z"
    pipeline: >-
      | STATS uploads = COUNT(*), total = SUM(http.request.bytes) BY day = BUCKET(@timestamp, 1 day), url.domain
      | SORT day, url.domain
