name: FortiGate native logs (key=value, kinds by type and subtype)
template: Event Data (Text)
capabilities: [timestamps, field_variability]
# FortiOS's own log lines, 800 of them: key=value pairs with quoted strings, date and time in separate keys with the
# zone in tz, eventtime in nanoseconds, and the kind of event in type and subtype (traffic forward, event system, utm
# ips), each kind with its own keys. The traps: the kind of event is two keys, not one; the time is date + time + tz
# (or eventtime's first 13 digits, in milliseconds); an admin login's outcome is status; and IPS alerts have no user.
request: >
  Onboard our FortiGate's logs (the file on my disk is in FortiOS's own format). Index the events.
expected:
  records: 800
  event_types: [Network, Authenticate, Alert]
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/Device/HostName, EventDetail/TypeId]
  values:
    EventSource/Device/HostName: [FGT60F]
files:
  - {name: fgt60f.log, generate: {kind: fortios_native, records: 800, seed: 13}}
reference:
  splitter: infer
  mapping:
    input: data_splitter
    common:
      - {path: EventTime/TimeCreated, xpath: "concat(data[@name='date']/@value, 'T', data[@name='time']/@value, data[@name='tz']/@value)", time_format: "yyyy-MM-dd'T'HH:mm:ssXX"}
      - {path: EventSource/System/Name, value: FortiGate}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: FortiOS}
      - {path: EventSource/Device/HostName, field: devname}
      - {path: EventSource/User/Id, field: user}
      - {path: EventSource/Client/IPAddress, field: srcip}
      - {path: EventDetail/TypeId, field: logid}
    events:
      - name: traffic
        when: [{field: type, equals: traffic}]
        fields:
          - {path: EventDetail/Network/Open/Source/Device/IPAddress, field: srcip}
          - {path: EventDetail/Network/Open/Source/Port, field: srcport}
          - {path: EventDetail/Network/Open/Destination/Device/IPAddress, field: dstip}
          - {path: EventDetail/Network/Open/Destination/Port, field: dstport}
          - {path: EventDetail/Network/Open/Data, data_name: service, field: service}
          - {path: EventDetail/Network/Open/Outcome/Permitted, field: action, map: {accept: 'true', deny: 'false'}}
      - name: admin-login
        when: [{field: type, equals: event}, {field: subtype, equals: system}]
        fields:
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: user}
          - {path: EventDetail/Authenticate/Outcome/Success, field: status, map: {success: 'true', failed: 'false'}}
          - {path: EventDetail/Description, field: msg}
      - name: ips
        when: [{field: type, equals: utm}]
        fields:
          - {path: EventDetail/Alert/Type, value: Other}
          - {path: EventDetail/Alert/Severity, field: severity, map: {critical: Critical, high: Major, medium: Minor}, default: Info}
          - {path: EventDetail/Alert/Description, field: attack}
          - {path: EventDetail/Alert/Data, data_name: action, field: action}
