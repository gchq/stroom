name: Microsoft 365 unified audit log, a later build (a new Identity group beside the promoted Messaging group)
template: Event Data (JSON)
capabilities: [aggregated_feeds, source_types, later_builds]
# A later build on an aggregated feed: case 56 built and promoted first (its feed, data, registry beside the feed, the
# Messaging group's pipeline, XSLT and index), then the user asks for the Azure AD records as a new group. The
# traps: the source type field asked again (the registry beside the feed says it); the new source type put in the
# Messaging group, or Messaging's pipeline, XSLT or index changed; the group's Events indexed into Messaging's index;
# the Messaging records (and the parked SharePoint and OneDrive ones) taken for errors in the Identity pipeline,
# which passes over all 328 of them.
setup: {from_case: 56}
request: >
  Our Microsoft 365 audit log is onboarded already: its feed carries every workload's records, and the Messaging
  group (Exchange Online and Teams) is built and promoted. Now add the Azure AD records as a new group called
  "Identity", with its Events indexed in an index of its own. Leave Messaging as it is.
user_knows: >
  The Identity group holds exactly one source type: AzureActiveDirectory. SharePoint and OneDrive stay parked for
  later builds. Messaging (ExchangeOnline and MicrosoftTeams) is promoted and must not change: not its pipeline, its
  XSLT or its index. The Workload field says which workload a record came from, as before. The other workloads'
  records being passed over by the Identity pipeline is expected; they are not errors. The system is Microsoft 365.
  Users' Ids stay whole, with their domain (sam.taylor@contoso.example), as Messaging writes them.
  String values longer than Stroom's JSON parser keeps (mail and message bodies past 10,000 characters) may be
  cut: the user is happy for them to be cut rather than kept whole.
expected:
  # The event type catalogue: Verb-Object TypeIds (the vendor's code as Data), at least so many event types,
  # and, once catalogue_event_types confirms one, its checks.
  type_ids: {min_distinct: 4}
  catalogue: {catch_all_confirmed: true, no_overlaps: true, no_condition_on_source_type_field: true}
  records: 72
  event_types: [Authenticate, Authorise|Update]
  paths: [EventTime/TimeCreated, EventSource/User/Id]
  values:
    EventSource/User/Id: [kate.jones@contoso.example, svc-batch@contoso.example, sam.taylor@contoso.example]
  # The other workloads' operations: their records are passed over, never translated.
  forbidden_values:
    EventSource/Generator: [SharePoint, OneDrive, ExchangeOnline, MicrosoftTeams]
  # Their operations, the vendor's code, which every event holds as Data: in none.
  forbidden_texts: [FileAccessed, SharingSet, MailItemsAccessed, Send, MessageSent, TeamMemberAdded]
  source_types:
    field: Workload
    group:
      name: Identity
      values: [AzureActiveDirectory]
      others: [ExchangeOnline, MicrosoftTeams, SharePoint, OneDrive]
    groups: [Messaging, Identity]
    pipeline: new
    rows:
      - {match: value, value: SharePoint, status: parked}
      - {match: value, value: OneDrive, status: parked}
    passed_over: 328
  forms:
    asked: [{message: "go in this build's source type group"}]
    not_asked: ["Which field says which source"]
  unchanged: true
  separate_index: true
  # What the events hold in the schema's own elements rather than Data (test chat 182, 2026-11-21, of the Messaging
  # group: almost nothing typed, which every check above passed). Each event type selected by its Operation, the
  # vendor's code wherever it is held; each path's alternatives the schema-correct homes a design may choose.
  # typed_at_least (2026-11-22, in place of Data-share caps a build keeping every field it doesn't place as Data
  # can't meet): the fewest distinct typed leaf paths the event type's events hold, as many as a correct mapping types
  # (2026-11-22: the reference's padding removed: User/Domain by transform, EmailAddress repeating the Id,
  # AuthService/Id from Workload, a constant Group/Type). Here the named paths tell a build that types the affected
  # user and the role (Haiku with a follow-up from the user) from one that doesn't (Haiku runs 2 and 3).
  typed:
    - select: {text: UserLoggedIn}
      paths: ["Authenticate/User/Id|Authenticate/User/EmailAddress|Authenticate/User/Name"]
      typed_at_least: 3
    - select: {text: UserLoginFailed}
      paths:
        - "Authenticate/User/Id|Authenticate/User/EmailAddress|Authenticate/User/Name"
        - "Authenticate/Outcome/Success|Authenticate/Outcome/Permitted|Authenticate/Outcome/Reason\
          |Authenticate/Outcome/Description"
      typed_at_least: 4
    - select: {text: Reset user password.}
      paths: ["Authenticate/User/Id|Authenticate/User/EmailAddress|Update/After/User/Id|Update/After/User/EmailAddress"]
      typed_at_least: 3
    - select: {text: Add member to role.}
      paths:
        - "Authorise/AddGroups/Group/Name|Authorise/AddGroups/Group/Id|Authorise/Group/Name|Authorise/Group/Id\
          |Update/After/Group/Name|Update/After/Group/Id|Update/After/Object/Name|Update/After/User/Groups/Group/Name\
          |Update/After/User/Groups/Group/Id|Authorise/User/Groups/Group/Name|Authorise/User/Groups/Group/Id"
        - "Authorise/User/Id|Authorise/User/EmailAddress|Update/After/User/Id|Update/After/User/EmailAddress"
      typed_at_least: 5
reference:
  # The user chose to cut values longer than the JSON parser keeps (user_knows): recorded with the draft.
  long_values: cut
  source_types:
    group: Identity
    source_types: [AzureActiveDirectory]
  mapping:
    input: json
    json_layout: lines
    common:
      - {path: EventTime/TimeCreated, field: CreationTime, time_format: "yyyy-MM-dd'T'HH:mm:ss", timezone: UTC}
      - {path: EventSource/System/Name, value: Microsoft 365}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, field: Workload}
      - {path: EventSource/Device/Name, value: Microsoft 365}
      - {path: EventSource/User/Id, field: UserId}
      - {path: EventSource/Client/IPAddress, field: ClientIP}
    events:
      - name: logon
        when: [{field: Operation, equals: UserLoggedIn}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-Logon}
          - {path: EventDetail/Description, value: A user signed in}
          - {path: EventDetail/Authenticate/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: UserId}
          - {path: EventDetail/Authenticate/Outcome/Success, value: 'true'}
      - name: logon_failed
        when: [{field: Operation, equals: UserLoginFailed}]
        fields:
          - {path: EventDetail/TypeId, value: Authenticate-FailedLogon}
          - {path: EventDetail/Description, value: A user failed to sign in}
          - {path: EventDetail/Authenticate/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: UserId}
          - {path: EventDetail/Authenticate/Outcome/Success, value: 'false'}
          - {path: EventDetail/Authenticate/Outcome/Description, field: event.LogonError}
      - name: password_reset
        when: [{field: Operation, equals: Reset user password.}]
        fields:
          - {path: EventDetail/TypeId, value: Reset-Password}
          - {path: EventDetail/Description, value: A user's password was reset}
          - {path: EventDetail/Authenticate/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Authenticate/Action, value: ResetPassword}
          # The user whose password was reset: the target that is a user principal name (Type 5).
          - {path: EventDetail/Authenticate/User/Id, xpath: "*[@key='event']/*[@key='Target']/*[*[@key='Type'] = '5']/*[@key='ID']"}
          - {path: EventDetail/Authenticate/Outcome/Success, field: event.ResultStatus,
             map: {Success: 'true', Failed: 'false'}}
      - name: role_member_added
        when: [{field: Operation, equals: Add member to role.}]
        fields:
          - {path: EventDetail/TypeId, value: Add-RoleMember}
          - {path: EventDetail/Description, value: A member was added to a role}
          - {path: EventDetail/Authorise/Data, data_name: Operation, field: Operation}
          - {path: EventDetail/Authorise/Action, value: Modify}
          # The member added: the target that is a user principal name (Type 5); the role, by its new values.
          - {path: EventDetail/Authorise/User/Id, xpath: "*[@key='event']/*[@key='Target']/*[*[@key='Type'] = '5']/*[@key='ID']"}
          - {path: EventDetail/Authorise/AddGroups/Group/Id,
             xpath: "*[@key='event']/*[@key='ModifiedProperties']/*[*[@key='Name'] = 'Role.TemplateId']/*[@key='NewValue']"}
          - {path: EventDetail/Authorise/AddGroups/Group/Name,
             xpath: "*[@key='event']/*[@key='ModifiedProperties']/*[*[@key='Name'] = 'Role.DisplayName']/*[@key='NewValue']"}
          - {path: EventDetail/Authorise/Outcome/Success, field: event.ResultStatus,
             map: {Success: 'true', Failed: 'false'}}
