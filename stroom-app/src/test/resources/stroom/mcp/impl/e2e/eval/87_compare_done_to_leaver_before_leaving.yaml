name: Was anything done to a leaver's account in the month before they left (a question, nothing built)
kind: question
capabilities: [compare, elasticsearch, insider]
# The insider-risk dataset's cloud audit events from 1 June to 25 September 2026 in one Elasticsearch index "Insider
# events", with the events done to people by others (InsiderDataset.targetActs: TargetPersonId and TargetUserName
# are whom an event was done to, PersonId and UserName who did it). The known answer (the dataset's "targets"): on
# 2026-09-14, 11 days before she leaves, an administrator (P20002) grants Dana Whitfield's account (P10001) the
# privileged group "Finance Data Admins", the first time that account has acted on hers. The traps: reading only her
# own activity (the grant is not her act and isn't in it); calling it her doing or intent; missing who did it.
# Skipped without an Elasticsearch node.
elastic_index:
  name: Insider events
  generate: {kind: insider_events, seed: 5848, background: 5, scale: 0.3, from: '2026-06-01', to: '2026-09-25',
             sources: [cloud], targets: true}
  fields: {EventTime: date, Source: text, PersonId: text, UserName: text, Account: text, HostName: text,
           EventDetail: text, Action: text, EventCode: text, Process: text, WindowTitle: text, WindowId: text,
           Object: text, Destination: text, Category: text, BytesOut: long, SessionId: text, Country: text,
           Site: text, TargetPersonId: text, TargetUserName: text}
request: >
  Dana Whitfield (person id P10001) left on 25 September 2026. Was anything done to her account in the month before
  she left? Use the "Insider events" index.
user_knows: >
  The "Insider events" Elasticsearch index holds the cloud audit log's events. PersonId and UserName are who acted;
  TargetPersonId and TargetUserName are whom an event was done to (access or a group granted, a password reset, MFA
  changed, a failed logon against an account), where it was done to someone. Action is what was done. Times are
  Sydney time (Australia/Sydney).
expected:
  tools_used: [compare_activity]
  answer:
    tool: compare_activity
    result: {person: P10001}
  findings:
    must_include:
      - {done_to_them: true, feature: 'done_to_them:events', near: '2026-09-14'}
      - {done_to_them: true, feature: 'done_to_them:new_actors', near: '2026-09-14'}
    must_not_include:
      - {feature: 'done_to_them:events'}
    answer_must_say_one_of: [granted, group, administrator]
    answer_must_not_say: [guilty, intends to]
reference:
  compare_activity:
    person: P10001
    personField: PersonId
    userField: UserName
    targetPersonField: TargetPersonId
    sources: [Insider events]
    windowFrom: '2026-08-24'
    windowTo: '2026-09-26'
    baselineFrom: '2026-06-01'
    unit: week
    peers: false
    includeTargets: true
    timeZone: Australia/Sydney
