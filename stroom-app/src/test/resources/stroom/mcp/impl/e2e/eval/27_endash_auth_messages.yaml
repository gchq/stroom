name: Auth service log (separators that are sometimes en dashes)
template: Event Data (Text)
capabilities: [encoding, delimiters]
request: >
  Onboard the auth service's application log. Each line has the time (UTC, with milliseconds after a comma), a level,
  the component in brackets, then a message: a user logging in (with the client address and session), a failed
  login (with the reason), or a user logging out. Index the events.
# The trap the test environment met: the separators are en dashes (U+2013) on most lines and hyphens on some, so a
# regex written with "-" matches some lines and not the rest.
expected:
  records: 5
  event_types: [Authenticate]
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventDetail/Authenticate/Action]
  values:
    EventSource/User/Id: [alice, bob, carol]
    EventSource/Client/IPAddress: [10.0.0.5, 203.0.113.9, 10.0.0.7]
sample: |
  2026-10-02 08:00:01,123 INFO  [auth] – User 'alice' logged in from 10.0.0.5 – session a1b2c3
  2026-10-02 08:00:09,456 WARN  [auth] – Login failed for user 'bob' from 203.0.113.9 – reason: bad password
  2026-10-02 08:05:00,001 INFO  [auth] - User 'carol' logged in from 10.0.0.7 - session d4e5f6
  2026-10-02 08:30:12,789 INFO  [auth] – User 'alice' logged out – session a1b2c3
  2026-10-02 09:12:44,010 INFO  [auth] - User 'carol' logged out - session d4e5f6
reference:
  splitter: {kind: regex, pattern: '^(\S+ \S+) (\S+)\s+\[([^\]]+)\] [–-] (.*)$', names: [time, level, component, message]}
  mapping:
    input: data_splitter
    extract:
      - {field: message, regex: "^User '([^']+)' logged (in|out)", names: [user_ok, direction]}
      - {field: message, regex: "^Login failed for user '([^']+)'", names: [user_failed]}
      - {field: message, regex: ' from (\S+)', names: [client]}
      - {field: message, regex: ' session (\S+)$', names: [session]}
      - {field: message, regex: ' reason: (.+)$', names: [reason]}
    common:
      - {path: EventTime/TimeCreated, field: time, time_format: "yyyy-MM-dd HH:mm:ss,SSS", timezone: UTC}
      - {path: EventSource/System/Name, value: Auth Service}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, field: component}
      - {path: EventSource/Device/HostName, value: auth01.example.org}
      - {path: EventSource/User/Id, any_of: [user_ok, user_failed]}
      - {path: EventSource/Client/IPAddress, field: client}
      - {path: EventDetail/Description, field: message}
    events:
      - name: logged in
        when: [{field: direction, equals: in}]
        fields:
          - {path: EventDetail/TypeId, value: login}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: user_ok}
          - {path: EventDetail/Authenticate/Data, data_name: session, field: session}
      - name: failed login
        when: [{field: user_failed, present: true}]
        fields:
          - {path: EventDetail/TypeId, value: login-failed}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: user_failed}
          - {path: EventDetail/Authenticate/Outcome/Success, value: 'false'}
          - {path: EventDetail/Authenticate/Outcome/Description, field: reason}
      - name: logged out
        when: [{field: direction, equals: out}]
        fields:
          - {path: EventDetail/TypeId, value: logout}
          - {path: EventDetail/Authenticate/Action, value: Logoff}
          - {path: EventDetail/Authenticate/User/Id, field: user_ok}
          - {path: EventDetail/Authenticate/Data, data_name: session, field: session}
