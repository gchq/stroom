name: XML fragments, one Event element per line
template: Event Data (XML)
capabilities: [format_recognition, event_boundaries]
request: >
  Onboard these workstation security events: XML fragments with no root element, one <Event> per line and no
  namespace. System holds the time, computer and event id (4624 successful logon, 4625 failed logon, 4634 logoff);
  EventData holds named Data values for the account and the client address. Index the events.
expected:
  records: 3
  event_types: [Authenticate]
  paths: [EventTime/TimeCreated, EventSource/Device/HostName, EventSource/User/Id, EventDetail/Authenticate/Action]
sample: |
  <Event><System><TimeCreated SystemTime="2026-10-01T10:00:00.000Z"/><Computer>ws01</Computer><EventID>4624</EventID></System><EventData><Data Name="TargetUserName">alice</Data><Data Name="IpAddress">10.0.0.1</Data><Data Name="LogonType">2</Data></EventData></Event>
  <Event><System><TimeCreated SystemTime="2026-10-01T10:05:00.000Z"/><Computer>ws02</Computer><EventID>4625</EventID></System><EventData><Data Name="TargetUserName">bob</Data><Data Name="IpAddress">10.0.0.9</Data><Data Name="LogonType">10</Data></EventData></Event>
  <Event><System><TimeCreated SystemTime="2026-10-01T10:30:00.000Z"/><Computer>ws01</Computer><EventID>4634</EventID></System><EventData><Data Name="TargetUserName">alice</Data><Data Name="LogonType">2</Data></EventData></Event>
reference:
  converter_type: XML_FRAGMENT
  replace_parser: XMLFragmentParser
  converter: |
    <?xml version="1.1" encoding="UTF-8"?>
    <!DOCTYPE records [
    <!ENTITY fragment SYSTEM "fragment">
    ]>
    <records xmlns="records:2" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
             xsi:schemaLocation="records:2 file://records-v2.0.xsd" version="2.0">
    &fragment;
    </records>
  mapping:
    input: xml_fragments
    xml_namespace: "records:2"
    record: Event
    common:
      - {path: EventTime/TimeCreated, field: System/TimeCreated/@SystemTime, time_format: "yyyy-MM-dd'T'HH:mm:ss.SSSX"}
      - {path: EventSource/System/Name, value: Workstations}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: Security}
      - {path: EventSource/Device/HostName, field: System/Computer}
      - {path: EventSource/Client/IPAddress, field: "EventData/Data[@Name='IpAddress']"}
      - {path: EventSource/User/Id, field: "EventData/Data[@Name='TargetUserName']"}
      - {path: EventDetail/TypeId, field: System/EventID}
      - {path: EventDetail/Authenticate/User/Id, field: "EventData/Data[@Name='TargetUserName']"}
      - {path: EventDetail/Authenticate/Data, data_name: LogonType, field: "EventData/Data[@Name='LogonType']"}
    events:
      - name: logon
        when: [{field: System/EventID, equals: "4624"}]
        fields:
          - {path: EventDetail/Description, value: An account was successfully logged on}
          - {path: EventDetail/Authenticate/Action, value: Logon}
      - name: failed logon
        when: [{field: System/EventID, equals: "4625"}]
        fields:
          - {path: EventDetail/Description, value: An account failed to log on}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/Outcome/Success, value: "false"}
      - name: logoff
        when: [{field: System/EventID, equals: "4634"}]
        fields:
          - {path: EventDetail/Description, value: An account was logged off}
          - {path: EventDetail/Authenticate/Action, value: Logoff}
