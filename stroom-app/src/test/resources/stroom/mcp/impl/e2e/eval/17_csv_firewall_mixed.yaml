reference:
  converter: csv_header
  mapping:
    input: data_splitter
    common:
      - {path: EventTime/TimeCreated, field: timestamp, time_format: "yyyy-MM-dd'T'HH:mm:ssXXX"}
      - {path: EventSource/System/Name, value: Edge Firewall}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: firewall}
      - {path: EventSource/Device/HostName, field: device}
      - {path: EventDetail/TypeId, field: action}
      - {path: EventDetail/Description, field: message}
    events:
      - name: connection
        when: [{field: event_type, equals: TRAFFIC}]
        fields:
          - {path: EventDetail/Network/Open/Source/Device/IPAddress, field: src_ip}
          - {path: EventDetail/Network/Open/Source/Port, field: src_port}
          - {path: EventDetail/Network/Open/Destination/Device/IPAddress, field: dst_ip}
          - {path: EventDetail/Network/Open/Destination/TransportProtocol, field: protocol}
          - {path: EventDetail/Network/Open/Destination/Port, field: dst_port}
          - {path: EventDetail/Network/Open/Rule, field: rule_id}
          - {path: EventDetail/Network/Open/Outcome/Permitted, field: action, map: {ALLOW: "true", DENY: "false"}}
          - {path: EventDetail/Network/Open/Data, data_name: bytes_sent, field: bytes_sent}
          - {path: EventDetail/Network/Open/Data, data_name: bytes_received, field: bytes_received}
      - name: logon
        when: [{field: event_type, equals: ADMIN}, {field: action, one_of: [LOGIN_SUCCESS, LOGIN_FAILED]}]
        fields:
          - {path: EventSource/User/Id, field: username}
          - {path: EventSource/Client/IPAddress, field: src_ip}
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: username}
          - {path: EventDetail/Authenticate/Outcome/Success, field: action, map: {LOGIN_SUCCESS: "true", LOGIN_FAILED: "false"}}
      - name: logoff
        when: [{field: event_type, equals: ADMIN}, {field: action, equals: LOGOUT}]
        fields:
          - {path: EventSource/User/Id, field: username}
          - {path: EventSource/Client/IPAddress, field: src_ip}
          - {path: EventDetail/Authenticate/Action, value: Logoff}
          - {path: EventDetail/Authenticate/User/Id, field: username}
      - name: config change
        when: [{field: event_type, equals: ADMIN}, {field: action, equals: CONFIG_CHANGE}]
        fields:
          - {path: EventSource/User/Id, field: username}
          - {path: EventSource/Client/IPAddress, field: src_ip}
          - {path: EventDetail/Update/After/Configuration/Name, value: Firewall rules}
      - name: config backup
        when: [{field: event_type, equals: ADMIN}, {field: action, equals: CONFIG_BACKUP}]
        fields:
          - {path: EventSource/User/Id, field: username}
          - {path: EventSource/Client/IPAddress, field: src_ip}
          - {path: EventDetail/Export/Source/Configuration/Name, value: Running configuration}
      - name: system
        when: [{field: event_type, equals: SYSTEM}]
        fields:
          - {path: EventDetail/Alert/Type, field: action, map: {VPN_TUNNEL_DOWN: Network, VPN_TUNNEL_UP: Network, CONFIG_SAVED: Change}, default: Other}
          - {path: EventDetail/Alert/Severity, field: severity, map: {INFO: Info, NOTICE: Info, WARNING: Minor, ERROR: Major}}
