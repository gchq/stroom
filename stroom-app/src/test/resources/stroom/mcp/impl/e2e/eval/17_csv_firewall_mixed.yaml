name: Edge firewall (CSV, mixed records)
template: Event Data (Text)
capabilities: [schema_variation, optional_fields, timestamps]
request: >
  Onboard the edge firewall's CSV export (it has a header). It mixes three kinds of record, told apart by
  event_type: TRAFFIC is a connection a rule allowed or denied; ADMIN is an administrator logging in (or failing
  to), logging out, or changing or backing up the configuration; SYSTEM is the firewall's own status (service start,
  configuration saved, CPU, VPN tunnel down and up), which analysts treat as alerts. Columns that don't apply to a
  record are empty or hold a space. Times carry their offset. Index the events.
expected:
  records: 20
  event_types: [Network, Authenticate, Alert]
  paths: [EventTime/TimeCreated, EventSource/Device/HostName, EventDetail/TypeId]
sample: |
  timestamp,device,event_type,severity,src_ip,src_port,dst_ip,dst_port,protocol,action,rule_id,bytes_sent,bytes_received,username,message
  2026-10-01T09:00:12+10:00,FW-EDGE-01,TRAFFIC,INFO,192.0.2.10,54321,198.51.100.20,443,TCP,ALLOW,1001,1520,8450,,Outbound HTTPS connection allowed
  2026-10-01T09:01:05+10:00,FW-EDGE-01,TRAFFIC,WARNING,203.0.113.45,49822,192.0.2.25,22,TCP,DENY,2003,0,0,,Inbound SSH connection blocked
  2026-10-01T09:02:17+10:00,FW-EDGE-01,TRAFFIC,INFO,192.0.2.11,53002,198.51.100.53,53,UDP,ALLOW,1002,84,192,,DNS query allowed
  2026-10-01T09:03:44+10:00,FW-EDGE-01,TRAFFIC,WARNING,203.0.113.67,60120,192.0.2.30,3389,TCP,DENY,2004,0,0,,Inbound RDP connection blocked
  2026-10-01T09:04:09+10:00,FW-EDGE-01,TRAFFIC,INFO,192.0.2.12,51515,198.51.100.80,80,TCP,ALLOW,1001,1024,4096,,Outbound HTTP connection allowed
  2026-10-01T09:05:33+10:00,FW-EDGE-01,TRAFFIC,WARNING,192.0.2.13,54210,198.51.100.21,21,TCP,DENY,2005,0,0,,Outbound FTP connection blocked
  2026-10-01T09:06:18+10:00,FW-EDGE-01,TRAFFIC,WARNING,192.0.2.14,55000,198.51.100.25,25,TCP,DENY,2006,0,0,,Outbound SMTP connection blocked
  2026-10-01T09:07:52+10:00,FW-EDGE-01,TRAFFIC,INFO,192.0.2.15,52001,198.51.100.22,22,TCP,ALLOW,1003,2300,5100,,Outbound SSH connection allowed
  2026-10-01T09:08:26+10:00,FW-EDGE-01,TRAFFIC,WARNING,203.0.113.89,48888,192.0.2.40,445,TCP,DENY,2007,0,0,,Inbound SMB connection blocked
  2026-10-01T09:09:41+10:00,FW-EDGE-01,TRAFFIC,INFO,192.0.2.16,53535,198.51.100.54,53,UDP,ALLOW,1002,96,224,,DNS query allowed
