name: A timeline with no source named, where one Elastic Index is empty and a Lucene index has no shards, its forms offering only the indexes holding documents (a chat)
kind: chat
capabilities: [timeline, elasticsearch, sources]
# One person's day (rpatel, 20 November 2026) among four data sources beside each other: "Web proxy events", an
# Elasticsearch index of rpatel's web requests and document edits (EvalTimelineScenes, scene empty_sources_web);
# "Badge events", an Elasticsearch index holding documents in the period, but only other people's badge events
# (scene empty_sources_badges); "Old proxy events", an Elasticsearch index that holds no documents at all, its name
# matching the user's words; and "Legacy proxy events", a Lucene index with no shards. The request names no source,
# so the timeline asks in its forms: the user says in their own words which ("the web proxy and badge events"),
# and the confirming form lists those matching, preselected. Run in Stroom's chat, where the forms are shown.
# Scored on the forms, the result and events.csv (EvalTimelineScore): the confirming form offers exactly the two
# Elastic Indexes holding documents; the empty one and the Lucene index are offered in no form; the empty one is
# named in the sources form, with why (holding none); and the timeline's events all come from "Web proxy events".
# The traps: offering the empty index because its name matches, listing the Lucene index, and failing the call over
# the index holding none of rpatel's events. Skipped without an Elasticsearch node.
elastic_index:
  name: Web proxy events
  generate: {kind: timeline_scenes, scene: empty_sources_web, seed: 117}
  fields: {EventTime: date, Source: text, UserName: text, Host: text, EventCode: text, Object: text}
more_elastic_indexes:
  - name: Badge events
    generate: {kind: timeline_scenes, scene: empty_sources_badges, seed: 117}
    fields: {EventTime: date, Source: text, UserName: text, EventCode: text, Site: text}
  - name: Old proxy events
    fields: {EventTime: date, UserName: text, Host: text, EventCode: text, Object: text}
empty_lucene_indexes: [Legacy proxy events]
agents: |
  # Activity data

  The indexes in this folder hold one flat record a product's event.

  ## Fields
  - user: UserName
  - host: Host
  - object: Object
  - event type: EventCode

  ## Event types
  - web.get: action
  - doc.edit: action
  - badge.enter: action
  - badge.leave: action
request: >
  What was rpatel doing on 20 November 2026? Build their activity timeline from the web proxy and badge events.
user_knows: >
  The web proxy and badge events are the data to read; the day is 20 November 2026 00:00 UTC up to, not including,
  21 November 2026.
expected:
  tools_used: [activity_timeline]
  # Scored on the turn's forms, the timeline's result and events.csv (EvalTimelineScore).
  timeline:
    entity: rpatel
    sources:
      offered: [Web proxy events, Badge events]
      not_offered: [Old proxy events, Legacy proxy events]
      left_out: {Old proxy events: holding none}
      read: [Web proxy events]
reference:
  calls:
    - {tool: activate_timelines, arguments: {}}
    - tool: activity_timeline
      arguments:
        entity: rpatel
        timeFrom: '2026-11-20T00:00:00.000Z'
        timeTo: '2026-11-21T00:00:00.000Z'
        timeZone: UTC
  # The sources form answered in the user's words; the confirming form as it preselects them.
  forms: {sources: Other (say which), other: the web proxy and badge events}
  answer: >-
    rpatel researched office chairs on a supplier's catalogue in the morning and worked on the purchase order in the
    afternoon. The badge events hold none of rpatel's; the old proxy index holds no documents, so it wasn't offered.
