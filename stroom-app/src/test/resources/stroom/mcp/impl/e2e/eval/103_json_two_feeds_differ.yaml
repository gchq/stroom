name: Two VPN feeds that differ (a field in one only, times in another zone), the union shown and confirmed
template: Event Data (JSON)
capabilities: [lifecycle, event_types, hand_written, several_feeds]
# EVAL-103 is translated by a hand-written pipeline; EVAL-103-B, a Sydney gateway, writes the same records with a
# site field the other lacks and its times with a +10:00 offset. The right route surveys both, shows the user the
# difference (compare_feeds: site in EVAL-103-B only, the zones differ) and has them confirm one translation for the
# union, then starts from the existing pipeline and promotes one filter selecting both. The trap: the difference
# merged silently (no compare_feeds), or EVAL-103-B left out of the filter.
promote: true
setup:
  hand_written:
    folder: /Feeds/EVAL-103
    feed: EVAL-103
    xslt: hand_written_vpn.xsl
    pipeline: EVAL-103-Events
    template: Event Data (JSON)
    properties: [{element: jsonParser, name: addRootObject, value: false}]
    processor_filter: {stream_type: Raw Events}
    sample: |
      [{"ts": "2026-11-03T08:00:01.000Z", "action": "login", "user": "jbloggs", "src_ip": "198.51.100.7", "host": "vpn-gw-1", "result": "success"},
       {"ts": "2026-11-03T08:02:45.000Z", "action": "login", "user": "asmith", "src_ip": "198.51.100.9", "host": "vpn-gw-1", "result": "failure"},
       {"ts": "2026-11-03T12:10:00.000Z", "action": "logout", "user": "jbloggs", "src_ip": "198.51.100.7", "host": "vpn-gw-1"},
       {"ts": "2026-11-03T09:30:00.000Z", "action": "config_change", "user": "admin", "host": "vpn-gw-1", "setting": "idle_timeout", "new_value": "900"},
       {"ts": "2026-11-03T09:31:00.000Z", "action": "heartbeat", "host": "vpn-gw-1"}]
    other_feeds:
      - feed: EVAL-103-B
        sample: |
          [{"ts": "2026-11-03T08:10:01.000+10:00", "action": "login", "user": "kjones", "src_ip": "198.51.100.20", "host": "vpn-syd-1", "result": "success", "site": "Sydney"},
          {"ts": "2026-11-03T08:12:45.000+10:00", "action": "login", "user": "pwhite", "src_ip": "198.51.100.21", "host": "vpn-syd-1", "result": "failure", "site": "Sydney"},
          {"ts": "2026-11-03T12:20:00.000+10:00", "action": "logout", "user": "kjones", "src_ip": "198.51.100.20", "host": "vpn-syd-1", "site": "Sydney"},
          {"ts": "2026-11-03T09:40:00.000+10:00", "action": "config_change", "user": "admin", "host": "vpn-syd-1", "setting": "idle_timeout", "new_value": "600", "site": "Sydney"},
          {"ts": "2026-11-03T09:41:00.000+10:00", "action": "heartbeat", "host": "vpn-syd-1", "site": "Sydney"}]

request: >
  EVAL-103 is our VPN audit feed, translated by a pipeline written by hand. EVAL-103-B is our Sydney gateway's feed of
  the same VPN. Have one translation serve both.
user_knows: >
  The Sydney gateway adds a site field, which needn't be translated, and writes its times with their +10:00 offset.
  One translation for both is right. Start from the existing pipeline when asked; keep its translation as it is.
expected:
  route:
    start_from: existing
    calls_in_order: [start_build, survey_feed, survey_feed, compare_feeds, catalogue_event_types, copy_pipeline, rebuild_mapping, catalogue_event_types, promote_build]
    forbidden_calls: [draft_translation_mapping]
  records: 4
  records_in_sample: 5
  event_types: [Authenticate, Update]
  forbidden_types: [Unknown]
  same_as_setup_except: []
  type_ids:
    pattern: any
    exactly: [vpn-login, vpn-login-failed, vpn-logout, vpn-config-change]
  catalogue: {catch_all_confirmed: true, event_types_at_least: 4, origin: "4 event types from 'EVAL-103-Events'"}
  promoted: {pipeline: EVAL-103-Events-V1.1, original_unchanged: true}
  several_feeds:
    compared: true
    fields_only_in: {site: [EVAL-103-B]}
    filter_feeds: [EVAL-103, EVAL-103-B]
reference:
  calls:
    - {tool: start_build, arguments: {build: eval-103, feeds: [EVAL-103, EVAL-103-B]}}
    - {tool: survey_feed, arguments: {feed: EVAL-103, build: eval-103}}
    - {tool: survey_feed, arguments: {feed: EVAL-103-B, build: eval-103}}
    - {tool: compare_feeds, arguments: {build: eval-103}}
    - {tool: catalogue_event_types, arguments: {build: eval-103}, answer: Start from the existing pipeline (recommended)}
    - {tool: copy_pipeline, arguments: {build: eval-103, source_uuid: <original>, new_name: EVAL-103-Events-V1.1}}
    - {tool: rebuild_mapping, arguments: {uuid: <copy xslt>, pipeline_uuid: <copy>, stream_ids: [<raw>],
                                          change: Read back from the hand-written translation}}
    - {tool: catalogue_event_types, arguments: {build: eval-103, stream_ids: [<raw>]}}
    - {tool: catalogue_event_types, arguments: {build: eval-103, confirm: true}, confirm: true}
    - {tool: step_sample, arguments: {pipeline_uuid: <copy>, stream_ids: [<raw>]}}
    - {tool: write_documentation, arguments: {build: eval-103, pipeline_uuid: <copy>, stream_ids: [<raw>],
                                              change: Serves every feed of the source,
                                              markdown: "## Purpose and data\n\nVPN sign-ins and settings, every gateway's feed.\n"}}
    - {tool: promote_build, arguments: {build: eval-103, destinations: {XSLT: Feeds/EVAL-103, Pipeline: Feeds/EVAL-103,
                                                                       Documentation: Feeds/EVAL-103}}}
