name: A day buried in a telemetry beacon and a scheduled script, the noise proposed, left out in one step and remembered (a chat)
kind: chat
capabilities: [timeline, elasticsearch, noise]
# One person's day (sward, 17 November 2026) in one Elasticsearch index "Workstation activity", made by
# EvalTimelineScenes (scene background_noise): a telemetry beacon every 30 seconds through the working day to one
# URL with no page (web.get), and a scheduled script every 5 minutes on the person's workstation (process.start,
# the same Object and Command, AccountType service); beside them the person's own work: research on a supplier's
# site and edits of a tender document. The chat's earlier turn built the timeline with the noise form declined
# (forms_declined), so the noise was only proposed and nothing was remembered: that turn's tables are the baseline.
# Scored on the turn asked: one noise form, accepted as proposed (every pattern ticked); the timeline reporting what
# it left out and how many; the exclusion remembered (a later run in the chat asks nothing and leaves them out
# again); the person's own work kept; and fewer events and rows of the activities view (what the model is asked
# about) than the baseline's. The traps: leaving the noise in, unticking the script, dropping the person's supplier
# research with the beacon (one type, other objects). Skipped without an Elasticsearch node.
elastic_index:
  name: Workstation activity
  generate: {kind: timeline_scenes, scene: background_noise, seed: 116}
  fields: {EventTime: date, Source: text, UserName: text, Host: text, EventCode: text, Object: text, Process: text,
           Command: text, AccountType: text}
chat:
  - ask: Build sward's activity timeline for 17 November 2026 from the "Workstation activity" index.
    forms_declined: [exclude]
    calls:
      - {tool: activate_timelines, arguments: {}}
      - tool: activity_timeline
        arguments:
          entity: sward
          timeFrom: '2026-11-17T00:00:00.000Z'
          timeTo: '2026-11-18T00:00:00.000Z'
          timeZone: UTC
          view: activities
          sources:
            - {index: Workstation activity, user: UserName, host: Host, object: Object, process: Process,
               eventTypeField: EventCode, typeRoles: {web.get: action, process.start: action, doc.edit: action}}
    answer: Here is sward's timeline; some patterns look like background noise.
request: >
  That's mostly background noise. Build sward's timeline for 17 November 2026 again, leaving the noise out, and
  tell me what sward actually did.
user_knows: >
  Source says which product wrote each event: proxy (EventCode web.get, Object the URL) and endpoint (EventCode
  process.start, Object the script or program, Command its command line, AccountType the account's type; EventCode
  doc.edit, Object the document). The
  telemetry beacon and the scheduled inventory script are background noise: leave them out, and keep them out next
  time. The day is 17 November 2026 00:00 UTC up to, not including, 18 November 2026.
expected:
  tools_used: [activity_timeline]
  # Scored on the turn's forms, the timeline's results and its tables against the earlier turn's (EvalTimelineScore).
  timeline:
    entity: sward
    noise:
      form: true
      excluded_at_least: 1000
      remembered: true
      gone: 'telemetry\.example\.net|inventory\.ps1'
      kept: 'supplier\.example\.com|Tender response'
      kept_at_least: 18
      fewer_than_baseline: [events.csv, activity-levels.csv]
reference:
  calls:
    - tool: activity_timeline
      arguments:
        entity: sward
        timeFrom: '2026-11-17T00:00:00.000Z'
        timeTo: '2026-11-18T00:00:00.000Z'
        timeZone: UTC
        view: activities
        sources:
          - {index: Workstation activity, user: UserName, host: Host, object: Object, process: Process,
             eventTypeField: EventCode, typeRoles: {web.get: action, process.start: action, doc.edit: action}}
    - tool: activity_timeline
      arguments:
        entity: sward
        timeFrom: '2026-11-17T00:00:00.000Z'
        timeTo: '2026-11-18T00:00:00.000Z'
        timeZone: UTC
        view: activities
        sources:
          - {index: Workstation activity, user: UserName, host: Host, object: Object, process: Process,
             eventTypeField: EventCode, typeRoles: {web.get: action, process.start: action, doc.edit: action}}
  answer: >-
    I left the telemetry beacon and the scheduled inventory script out (and will on later runs); sward researched a
    supplier's products in the morning and worked on the tender response in the afternoon.
