name: Print server jobs (headerless CSV, quoted values)
template: Event Data (Text)
capabilities: [delimiters, escaping]
request: >
  Onboard the print server's job log. It's CSV with no header line; the columns are the time (UTC), the user, the
  printer, the document name, the page count and the printer's location. Document names and locations with commas
  are quoted. Each record is a print job that finished. Index the events.
expected:
  records: 4
  event_types: [Print]
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/User/Id, EventDetail/Print/Action]
  values:
    EventSource/User/Id: [alice, "o'brien, pat", carol]
sample: |
  2026-10-02T10:00:00Z,alice,PRN-FIN-02,"Q3 results, final.pdf",12,"Finance, 2nd floor"
  2026-10-02T10:04:00Z,"o'brien, pat",PRN-FIN-02,Expenses.xlsx,2,"Finance, 2nd floor"
  2026-10-02T10:20:00Z,carol,PRN-ENG-01,"Design ""v2"" review.docx",30,Engineering
  2026-10-02T11:00:00Z,alice,PRN-ENG-01,Badge.pdf,1,Engineering
reference:
  # No header: the columns are named, as the user said them; the rest is the server's Data Splitter.
  splitter: {kind: delimited, delimiter: ",", quote: '"', header: [time, user, printer, document, pages, location]}
  mapping:
    input: data_splitter
    common:
      - {path: EventTime/TimeCreated, field: time, time_format: "yyyy-MM-dd'T'HH:mm:ssX"}
      - {path: EventSource/System/Name, value: Print Services}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: print-server}
      - {path: EventSource/Device/HostName, field: printer}
      - {path: EventSource/User/Id, field: user, transform: unescape_quotes}
      - {path: EventDetail/TypeId, value: print-job}
    events:
      - name: printed
        fields:
          - {path: EventDetail/Print/Action, value: FinishPrint}
          - {path: EventDetail/Print/PrintJob/Document/Title, field: document, transform: unescape_quotes}
          - {path: EventDetail/Print/PrintJob/Pages, field: pages}
          - {path: EventDetail/Print/Printer/Name, field: printer}
          - {path: EventDetail/Print/Data, data_name: printer_location, field: location, transform: unescape_quotes}
