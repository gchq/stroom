name: The decoys are not flagged (a question, nothing built)
kind: question
capabilities: [compare, elasticsearch, insider]
# The insider-risk dataset's proxy and cloud audit events from 2 February to 31 July 2026 in one Elasticsearch index
# "Insider events". The decoys: P20001's approved data-centre migration (bulk transfers 2026-05-11 to 2026-05-15, an
# approved exception the request names) and the proxy's pipeline change on 2026-06-15 (everyone's volume doubles).
# Neither may be reported as the person's: the exception's days aren't scored, and the pipeline's step is listed as
# the source's. Skipped without an Elasticsearch node.
elastic_index:
  name: Insider events
  generate: {kind: insider_events, seed: 5848, background: 12, scale: 0.15, from: '2026-02-02', to: '2026-07-31',
             sources: [proxy, cloud]}
  fields: {EventTime: date, Source: text, PersonId: text, UserName: text, Account: text, HostName: text,
           EventDetail: text, Action: text, EventCode: text, Process: text, WindowTitle: text, WindowId: text,
           Object: text, Destination: text, Category: text, BytesOut: long, SessionId: text, Country: text,
           Site: text}
request: >
  Review Ava Hart's (person id P20001) activity from 4 May to 26 June 2026 against her earlier months. The
  data-centre migration she worked on from 11 to 15 May 2026 was approved. Use the "Insider events" index.
user_knows: >
  The "Insider events" Elasticsearch index holds every source's events: PersonId is the person's id, the same in
  every source (UserName differs by source); Destination is the site a web request reached, Category the proxy's
  category of it, BytesOut the bytes sent, Site the cloud site a file came from, Country where a sign-in came from.
  Times are Sydney time (Australia/Sydney).
expected:
  tools_used: [compare_activity]
  answer:
    tool: compare_activity
    result: {person: P20001}
  findings:
    must_not_include:
      - {window_in: ['2026-05-11', '2026-05-15']}
      - {kind: change, feature: events, near: '2026-06-15', days: 5}
    answer_must_say_one_of: [approved, exception, migration]
reference:
  compare_activity:
    person: P20001
    personField: PersonId
    sources: [Insider events]
    windowFrom: '2026-05-04'
    windowTo: '2026-06-27'
    baselineFrom: '2026-02-02'
    unit: week
    exceptions: ['2026-05-11..2026-05-15: approved data-centre migration']
    peers: false
    timeZone: Australia/Sydney
