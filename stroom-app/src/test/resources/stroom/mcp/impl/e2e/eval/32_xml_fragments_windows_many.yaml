  <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>4729</EventID><TimeCreated SystemTime="2026-10-02T10:50:00.0170000Z"/><Computer>dc02.corp.example.org</Computer></System><EventData><Data Name="SubjectUserName">alice</Data><Data Name="MemberName">CN=bob,OU=Staff,DC=corp</Data><Data Name="TargetUserName">Domain Admins</Data></EventData></Event>
  <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>4740</EventID><TimeCreated SystemTime="2026-10-02T11:00:00.0180000Z"/><Computer>dc01.corp.example.org</Computer></System><EventData><Data Name="SubjectUserName">DC01$</Data><Data Name="TargetUserName">bob</Data></EventData></Event>
