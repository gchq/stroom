  <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>4722</EventID><TimeCreated SystemTime="2026-10-02T09:50:00.0110000Z"/><Computer>dc02.corp.example.org</Computer></System><EventData><Data Name="SubjectUserName">alice</Data><Data Name="TargetUserName">newstarter</Data></EventData></Event>
