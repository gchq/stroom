  <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>1102</EventID><TimeCreated SystemTime="2026-10-02T11:20:00.0200000Z"/><Computer>dc01.corp.example.org</Computer></System><EventData><Data Name="SubjectUserName">bob</Data></EventData></Event>
  <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>5140</EventID><TimeCreated SystemTime="2026-10-02T11:30:00.0210000Z"/><Computer>dc02.corp.example.org</Computer></System><EventData><Data Name="SubjectUserName">carol</Data><Data Name="ShareName">\\*\Finance</Data><Data Name="IpAddress">10.0.0.7</Data></EventData></Event>
reference:
  converter_type: XML_FRAGMENT
  converter: profile
  replace_parser: XMLFragmentParser
  mapping:
    input: xml_fragments
    xml_namespace: http://schemas.microsoft.com/win/2004/08/events/event
    record: Event
    common:
    - path: EventTime/TimeCreated
      xpath: replace(System/TimeCreated/@SystemTime, '(\.\d{3})\d*Z$', '$1Z')
      time_format: yyyy-MM-dd'T'HH:mm:ss.SSSX
    - path: EventSource/System/Name
      value: Active Directory
    - path: EventSource/System/Environment
      value: Eval
    - path: EventSource/Generator
      field: System/Provider/@Name
    - path: EventSource/Device/HostName
      field: System/Computer
    - path: EventDetail/TypeId
      field: System/EventID
    events:
    - name: an account was successfully logged on
      when:
      - field: System/EventID
        equals: '4624'
      fields:
      - path: EventDetail/Description
        value: An account was successfully logged on
      - path: EventSource/User/Id
        field: EventData/Data[@Name='TargetUserName']
      - path: EventSource/Client/IPAddress
        field: EventData/Data[@Name='IpAddress']
      - path: EventDetail/Authenticate/Action
        value: Logon
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: an account failed to log on
      when:
      - field: System/EventID
        equals: '4625'
      fields:
      - path: EventDetail/Description
        value: An account failed to log on
      - path: EventSource/User/Id
        field: EventData/Data[@Name='TargetUserName']
      - path: EventSource/Client/IPAddress
        field: EventData/Data[@Name='IpAddress']
      - path: EventDetail/Authenticate/Action
        value: Logon
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='TargetUserName']
      - path: EventDetail/Authenticate/Outcome/Success
        value: 'false'
    - name: an account was logged off
      when:
      - field: System/EventID
        equals: '4634'
      fields:
      - path: EventDetail/Description
        value: An account was logged off
      - path: EventSource/User/Id
        field: EventData/Data[@Name='TargetUserName']
      - path: EventDetail/Authenticate/Action
        value: Logoff
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: user initiated logoff
      when:
      - field: System/EventID
        equals: '4647'
      fields:
      - path: EventDetail/Description
        value: User initiated logoff
      - path: EventSource/User/Id
        field: EventData/Data[@Name='TargetUserName']
      - path: EventDetail/Authenticate/Action
        value: Logoff
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: a logon was attempted using explicit credentials
      when:
      - field: System/EventID
        equals: '4648'
      fields:
      - path: EventDetail/Description
        value: A logon was attempted using explicit credentials
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Authenticate/Action
        value: Logon
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='TargetUserName']
      - path: EventDetail/Authenticate/Data
        data_name: target_server
        field: EventData/Data[@Name='TargetServerName']
    - name: special privileges assigned to new logon
      when:
      - field: System/EventID
        equals: '4672'
      fields:
      - path: EventDetail/Description
        value: Special privileges assigned to new logon
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Authenticate/Action
        value: ElevatePrivilege
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Authenticate/Data
        data_name: privileges
        field: EventData/Data[@Name='PrivilegeList']
    - name: a new process has been created
      when:
      - field: System/EventID
        equals: '4688'
      fields:
      - path: EventDetail/Description
        value: A new process has been created
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Process/Action
        value: Execute
      - path: EventDetail/Process/Type
        value: Application
      - path: EventDetail/Process/Command
        field: EventData/Data[@Name='NewProcessName']
      - path: EventDetail/Process/Arguments
        field: EventData/Data[@Name='CommandLine']
    - name: a process has exited
      when:
      - field: System/EventID
        equals: '4689'
      fields:
      - path: EventDetail/Description
        value: A process has exited
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Process/Action
        value: Terminate
      - path: EventDetail/Process/Type
        value: Application
      - path: EventDetail/Process/Command
        field: EventData/Data[@Name='ProcessName']
    - name: a service was installed in the system
      when:
      - field: System/EventID
        equals: '4697'
      fields:
      - path: EventDetail/Description
        value: A service was installed in the system
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Install/Software/Name
        field: EventData/Data[@Name='ServiceName']
      - path: EventDetail/Install/Software/Data
        data_name: file
        field: EventData/Data[@Name='ServiceFileName']
    - name: system audit policy was changed
      when:
      - field: System/EventID
        equals: '4719'
      fields:
      - path: EventDetail/Description
        value: System audit policy was changed
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Update/After/Configuration/Type
        value: Audit policy
      - path: EventDetail/Update/After/Configuration/Name
        field: EventData/Data[@Name='CategoryId']
      - path: EventDetail/Update/After/Configuration/Data
        data_name: change
        field: EventData/Data[@Name='AuditPolicyChanges']
    - name: a user account was created
      when:
      - field: System/EventID
        equals: '4720'
      fields:
      - path: EventDetail/Description
        value: A user account was created
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Create/User/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: a user account was enabled
      when:
      - field: System/EventID
        equals: '4722'
      fields:
      - path: EventDetail/Description
        value: A user account was enabled
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Update/After/User/Id
        field: EventData/Data[@Name='TargetUserName']
      - path: EventDetail/Update/After/User/Data
        data_name: change
        value: enabled
    - name: an attempt was made to change an accounts password
      when:
      - field: System/EventID
        equals: '4723'
      fields:
      - path: EventDetail/Description
        value: An attempt was made to change an account's password
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Authenticate/Action
        value: ChangePassword
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: an attempt was made to reset an accounts password
      when:
      - field: System/EventID
        equals: '4724'
      fields:
      - path: EventDetail/Description
        value: An attempt was made to reset an account's password
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Authenticate/Action
        value: ResetPassword
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: a user account was disabled
      when:
      - field: System/EventID
        equals: '4725'
      fields:
      - path: EventDetail/Description
        value: A user account was disabled
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Update/After/User/Id
        field: EventData/Data[@Name='TargetUserName']
      - path: EventDetail/Update/After/User/Data
        data_name: change
        value: disabled
    - name: a user account was deleted
      when:
      - field: System/EventID
        equals: '4726'
      fields:
      - path: EventDetail/Description
        value: A user account was deleted
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Delete/User/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: a member was added to a security-enabled global group
      when:
      - field: System/EventID
        equals: '4728'
      fields:
      - path: EventDetail/Description
        value: A member was added to a security-enabled global group
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Authorise/Action
        value: Modify
      - path: EventDetail/Authorise/User/Id
        field: EventData/Data[@Name='MemberName']
      - path: EventDetail/Authorise/AddGroups/Group/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: a member was removed from a security-enabled global group
      when:
      - field: System/EventID
        equals: '4729'
      fields:
      - path: EventDetail/Description
        value: A member was removed from a security-enabled global group
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Authorise/Action
        value: Modify
      - path: EventDetail/Authorise/User/Id
        field: EventData/Data[@Name='MemberName']
      - path: EventDetail/Authorise/RemoveGroups/Group/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: a user account was locked out
      when:
      - field: System/EventID
        equals: '4740'
      fields:
      - path: EventDetail/Description
        value: A user account was locked out
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Authenticate/Action
        value: AccountLock
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: a user account was unlocked
      when:
      - field: System/EventID
        equals: '4767'
      fields:
      - path: EventDetail/Description
        value: A user account was unlocked
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Authenticate/Action
        value: AccountUnlock
      - path: EventDetail/Authenticate/User/Id
        field: EventData/Data[@Name='TargetUserName']
    - name: the audit log was cleared
      when:
      - field: System/EventID
        equals: '1102'
      fields:
      - path: EventDetail/Description
        value: The audit log was cleared
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventDetail/Delete/Object/Type
        value: Event log
      - path: EventDetail/Delete/Object/Name
        value: Security
    - name: a network share object was accessed
      when:
      - field: System/EventID
        equals: '5140'
      fields:
      - path: EventDetail/Description
        value: A network share object was accessed
      - path: EventSource/User/Id
        field: EventData/Data[@Name='SubjectUserName']
      - path: EventSource/Client/IPAddress
        field: EventData/Data[@Name='IpAddress']
      - path: EventDetail/View/Folder/Path
        field: EventData/Data[@Name='ShareName']
