  <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>4647</EventID><TimeCreated SystemTime="2026-10-02T08:30:00.0030000Z"/><Computer>dc02.corp.example.org</Computer></System><EventData><Data Name="TargetUserName">carol</Data></EventData></Event>
