name: Firewall user events (epoch nanoseconds, epoch seconds and zoneless local time)
template: Event Data (Text)
capabilities: [timestamps]
request: >
  Onboard our Sydney firewalls' user events, forwarded by the log collector as key=value lines. Each line says when
  three ways: itime (when the collector received it), date and time (the firewall's clock), and eventtime (when it
  happened, the one to use). Each line is a user signing in, failing to sign in, or signing out of the firewall's
  VPN portal. Index the events.
# The traps: eventtime is in nanoseconds (19 digits), which no epoch_ms or epoch_s reading fits; date and time carry
# no zone and are local (+10:00), so read as UTC they are ten hours out; itime is epoch seconds, when the collector
# had it. Every route that gets the instant right passes; the values check holds the instants.
user_knows: >
  The firewalls' clocks are set to Sydney local time, UTC+10:00 (daylight saving hadn't started yet). eventtime is
  the time the event happened, in nanoseconds since 1970 (UTC).
expected:
  records: 5
  event_types: [Authenticate]
  forbidden_types: [Unknown]
  paths: [EventTime/TimeCreated, EventSource/Device/HostName, EventSource/User/Id, EventDetail/Authenticate/Action]
  values:
    EventTime/TimeCreated: ['2026-10-01T10:00:00.000Z', '2026-10-01T10:04:30.000Z', '2026-10-01T11:00:00.000Z', '2026-10-01T23:59:58.000Z']
    EventSource/User/Id: [alice, bob, carol]
sample: |
  itime=1790848801 date=2026-10-01 time=20:00:00 devname="FGT-SYD-01" eventtime=1790848800000412233 logid="0101039424" type="event" subtype="vpn" action="tunnel-up" user="alice" remip=203.0.113.20 msg="SSL tunnel established"
  itime=1790849071 date=2026-10-01 time=20:04:30 devname="FGT-SYD-01" eventtime=1790849070000187001 logid="0101039426" type="event" subtype="vpn" action="ssl-login-fail" user="bob" remip=198.51.100.71 msg="SSL user failed to logged in"
  itime=1790849703 date=2026-10-01 time=20:15:02 devname="FGT-SYD-02" eventtime=1790849702000903114 logid="0101039424" type="event" subtype="vpn" action="tunnel-up" user="carol" remip=203.0.113.44 msg="SSL tunnel established"
  itime=1790852401 date=2026-10-01 time=21:00:00 devname="FGT-SYD-01" eventtime=1790852400000060750 logid="0101039425" type="event" subtype="vpn" action="tunnel-down" user="alice" remip=203.0.113.20 msg="SSL tunnel shutdown"
  itime=1790899199 date=2026-10-02 time=09:59:58 devname="FGT-SYD-02" eventtime=1790899198000555000 logid="0101039425" type="event" subtype="vpn" action="tunnel-down" user="carol" remip=203.0.113.44 msg="SSL tunnel shutdown"
reference:
  splitter: infer
  mapping:
    input: data_splitter
    # eventtime's first 13 digits are its milliseconds since 1970.
    extract:
      - {field: eventtime, regex: '^(\d{13})', names: [eventtime_ms]}
    common:
      - {path: EventTime/TimeCreated, field: eventtime_ms, time_format: epoch_ms}
      - {path: EventSource/System/Name, value: VPN Portal}
      - {path: EventSource/System/Environment, value: Eval}
      - {path: EventSource/Generator, value: fortigate}
      - {path: EventSource/Device/HostName, field: devname}
      - {path: EventSource/User/Id, field: user}
      - {path: EventSource/Client/IPAddress, field: remip}
      - {path: EventDetail/TypeId, field: logid}
      - {path: EventDetail/Description, field: msg}
    events:
      - name: signed in
        when: [{field: action, equals: tunnel-up}]
        fields:
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: user}
      - name: failed sign in
        when: [{field: action, equals: ssl-login-fail}]
        fields:
          - {path: EventDetail/Authenticate/Action, value: Logon}
          - {path: EventDetail/Authenticate/User/Id, field: user}
          - {path: EventDetail/Authenticate/Outcome/Success, value: 'false'}
      - name: signed out
        when: [{field: action, equals: tunnel-down}]
        fields:
          - {path: EventDetail/Authenticate/Action, value: Logoff}
          - {path: EventDetail/Authenticate/User/Id, field: user}
