name: Three VPN gateway feeds of one shape onboarded at once onto the existing translation
template: Event Data (JSON)
capabilities: [lifecycle, event_types, hand_written, several_feeds]
# EVAL-102 is translated by a hand-written pipeline; EVAL-102-B and EVAL-102-C are two more gateways of the same VPN,
# their records of the same shape, translated by nothing yet. The user wants one translation for all three. The right
# route surveys each feed (next names them in turn), shows the user that they look alike (compare_feeds, the union
# confirmed and each feed's zone), starts from the existing pipeline, and promotes one filter selecting all three.
# The traps: surveying only the first feed, a filter for EVAL-102 alone, or drafting a new translation.
promote: true
setup:
  hand_written:
    folder: /Feeds/EVAL-102
    feed: EVAL-102
    xslt: hand_written_vpn.xsl
    pipeline: EVAL-102-Events
    template: Event Data (JSON)
    properties: [{element: jsonParser, name: addRootObject, value: false}]
    processor_filter: {stream_type: Raw Events}
    sample: |
      [{"ts": "2026-11-03T08:00:01.000Z", "action": "login", "user": "jbloggs", "src_ip": "198.51.100.7", "host": "vpn-gw-1", "result": "success"},
       {"ts": "2026-11-03T08:02:45.000Z", "action": "login", "user": "asmith", "src_ip": "198.51.100.9", "host": "vpn-gw-1", "result": "failure"},
       {"ts": "2026-11-03T12:10:00.000Z", "action": "logout", "user": "jbloggs", "src_ip": "198.51.100.7", "host": "vpn-gw-1"},
       {"ts": "2026-11-03T09:30:00.000Z", "action": "config_change", "user": "admin", "host": "vpn-gw-1", "setting": "idle_timeout", "new_value": "900"},
       {"ts": "2026-11-03T09:31:00.000Z", "action": "heartbeat", "host": "vpn-gw-1"}]
    other_feeds:
      - feed: EVAL-102-B
        sample: |
          [{"ts": "2026-11-03T08:10:01.000Z", "action": "login", "user": "kjones", "src_ip": "198.51.100.20", "host": "vpn-gw-2", "result": "success"},
          {"ts": "2026-11-03T08:12:45.000Z", "action": "login", "user": "pwhite", "src_ip": "198.51.100.21", "host": "vpn-gw-2", "result": "failure"},
          {"ts": "2026-11-03T12:20:00.000Z", "action": "logout", "user": "kjones", "src_ip": "198.51.100.20", "host": "vpn-gw-2"},
          {"ts": "2026-11-03T09:40:00.000Z", "action": "config_change", "user": "admin", "host": "vpn-gw-2", "setting": "idle_timeout", "new_value": "600"},
          {"ts": "2026-11-03T09:41:00.000Z", "action": "heartbeat", "host": "vpn-gw-2"}]
      - feed: EVAL-102-C
        sample: |
          [{"ts": "2026-11-03T08:10:01.000Z", "action": "login", "user": "kjones", "src_ip": "198.51.100.20", "host": "vpn-gw-3", "result": "success"},
          {"ts": "2026-11-03T08:12:45.000Z", "action": "login", "user": "pwhite", "src_ip": "198.51.100.21", "host": "vpn-gw-3", "result": "failure"},
          {"ts": "2026-11-03T12:20:00.000Z", "action": "logout", "user": "kjones", "src_ip": "198.51.100.20", "host": "vpn-gw-3"},
          {"ts": "2026-11-03T09:40:00.000Z", "action": "config_change", "user": "admin", "host": "vpn-gw-3", "setting": "idle_timeout", "new_value": "600"},
          {"ts": "2026-11-03T09:41:00.000Z", "action": "heartbeat", "host": "vpn-gw-3"}]

request: >
  EVAL-102 is our VPN audit feed, translated by a pipeline written by hand. EVAL-102-B and EVAL-102-C are two more
  gateways of the same VPN, sending the same logs. Have one translation serve all three feeds.
user_knows: >
  The three feeds are the same VPN product; their records are alike. Start from the existing pipeline when asked and
  keep its translation as it is. All three feeds' times are UTC.
expected:
  route:
    start_from: existing
    calls_in_order: [start_build, survey_feed, survey_feed, survey_feed, compare_feeds, catalogue_event_types, copy_pipeline, rebuild_mapping, catalogue_event_types, promote_build]
    forbidden_calls: [draft_translation_mapping]
  records: 4
  records_in_sample: 5
  event_types: [Authenticate, Update]
  forbidden_types: [Unknown]
  same_as_setup_except: []
  type_ids:
    pattern: any
    exactly: [vpn-login, vpn-login-failed, vpn-logout, vpn-config-change]
  catalogue: {catch_all_confirmed: true, event_types_at_least: 4, origin: "4 event types from 'EVAL-102-Events'"}
  promoted: {pipeline: EVAL-102-Events-V1.1, original_unchanged: true}
  several_feeds:
    compared: true
    filter_feeds: [EVAL-102, EVAL-102-B, EVAL-102-C]
reference:
  calls:
    - {tool: start_build, arguments: {build: eval-102, feeds: [EVAL-102, EVAL-102-B, EVAL-102-C]}}
    - {tool: survey_feed, arguments: {feed: EVAL-102, build: eval-102}}
    - {tool: survey_feed, arguments: {feed: EVAL-102-B, build: eval-102}}
    - {tool: survey_feed, arguments: {feed: EVAL-102-C, build: eval-102}}
    - {tool: compare_feeds, arguments: {build: eval-102}}
    - {tool: catalogue_event_types, arguments: {build: eval-102}, answer: Start from the existing pipeline (recommended)}
    - {tool: copy_pipeline, arguments: {build: eval-102, source_uuid: <original>, new_name: EVAL-102-Events-V1.1}}
    - {tool: rebuild_mapping, arguments: {uuid: <copy xslt>, pipeline_uuid: <copy>, stream_ids: [<raw>],
                                          change: Read back from the hand-written translation}}
    - {tool: catalogue_event_types, arguments: {build: eval-102, stream_ids: [<raw>]}}
    - {tool: catalogue_event_types, arguments: {build: eval-102, confirm: true}, confirm: true}
    - {tool: step_sample, arguments: {pipeline_uuid: <copy>, stream_ids: [<raw>]}}
    - {tool: write_documentation, arguments: {build: eval-102, pipeline_uuid: <copy>, stream_ids: [<raw>],
                                              change: Serves every feed of the source,
                                              markdown: "## Purpose and data\n\nVPN sign-ins and settings, every gateway's feed.\n"}}
    - {tool: promote_build, arguments: {build: eval-102, destinations: {XSLT: Feeds/EVAL-102, Pipeline: Feeds/EVAL-102,
                                                                       Documentation: Feeds/EVAL-102}}}
