<!--
  The index.html asset of the workbench's test visualisation 'vis-tooltip'
  (App/Dashboard/VisTooltip). Stroom's VisController loads a visualisation's index.html asset, when
  it has one, into the visualisation's frame as /assets/<uuid>/index.html, then drives it with
  vis.js's messages as it does a visualisation made of scripts. The workbench serves this file at
  that path.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tooltip test visualisation</title>
    <script src="/ui/vis.js"></script>
    <script src="tooltip-test-vis.js"></script>
</head>
<body></body>
</html>
