<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 100 60">
  <!-- A test floor plan for the FloorMap visualisation stories: an office floor 100 by 60 units -->
  <rect x="0" y="0" width="100" height="60" fill="#f4f1ea"/>
  <g fill="none" stroke="#555" stroke-width="0.6">
    <rect x="1" y="1" width="98" height="58"/>
    <line x1="40" y1="1" x2="40" y2="25"/>
    <line x1="70" y1="1" x2="70" y2="25"/>
    <line x1="1" y1="25" x2="99" y2="25"/>
    <line x1="1" y1="35" x2="99" y2="35"/>
    <line x1="50" y1="35" x2="50" y2="59"/>
  </g>
  <g font-family="sans-serif" font-size="3" fill="#777" text-anchor="middle">
    <text x="20" y="13">Open Plan</text>
    <text x="55" y="13">Meeting Room</text>
    <text x="85" y="13">Server Room</text>
    <text x="50" y="31">Corridor</text>
    <text x="25" y="48">Kitchen</text>
    <text x="75" y="48">Reception</text>
  </g>
</svg>
