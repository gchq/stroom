<div class="wbm-layout" id="wbm-layout">

    <!-- Sidebar -->
    <div class="wbm-sidebar" id="workbench-sidebar-region" role="banner">
        <div class="wbm-resizer wbm-resizer--sidebar" id="wbm-sidebar-resizer" role="separator"
             aria-label="Sidebar resize handle"></div>
        <div class="wbm-sidebar__scroll">
            <div class="wbm-sidebar__content">
                <div class="wbm-sidebar__header">
                    <a class="wbm-brand" title="Stroom GWT Workbench" href="./">
                        <span class="wbm-brand__mark-name"><svg class="wbm-brand__mark" aria-hidden="true"><use href="#wbm-logo"></use></svg><span class="wbm-brand__name">Stroom GWT Workbench</span></span>
                    </a>
                    <button class="wbm-icon-button wbm-icon-button--32" id="wbm-settings-button" aria-label="Settings"
                            aria-haspopup="menu" aria-expanded="false" type="button">
                        <svg class="wbm-icon"><use href="#wbm-icon-settings"/></svg>
                    </button>
                </div>

                <div class="wbm-search" role="search">
                    <div class="wbm-search__field" id="wbm-search-field">
                        <div class="wbm-search__icon">
                            <svg class="wbm-icon"><use href="#wbm-icon-search"/></svg>
                        </div>
                        <input class="wbm-search__input" id="workbench-explorer-searchfield" type="search"
                               placeholder="Find components" autocomplete="off" spellcheck="false"
                               aria-label="Search for components"/>
                        <code class="wbm-search__shortcut" id="wbm-search-shortcut"></code>
                        <button class="wbm-icon-button wbm-search__clear" id="wbm-search-clear" type="button"
                                aria-label="Clear search">
                            <svg class="wbm-icon"><use href="#wbm-icon-clear"/></svg>
                        </button>
                        <button class="wbm-icon-button wbm-tag-filter-button" id="wbm-tag-filter" aria-label="Tag filters" type="button">
                            <svg class="wbm-icon"><use href="#wbm-icon-filter"/></svg>
                        </button>
                    </div>
                    <button class="wbm-icon-button wbm-icon-button--32 wbm-create-button" id="wbm-create-button" type="button"
                            aria-label="Create a new story">
                        <svg class="wbm-icon"><use href="#wbm-icon-plus"/></svg>
                    </button>
                </div>

                <div class="wbm-tree-wrapper" id="workbench-explorer-menu" tabindex="0">
                    <nav class="wbm-tree" id="workbench-explorer-tree" role="navigation" aria-label="Stories">
                    </nav>
                </div>
            </div>
        </div>

    <!-- Toolbar and preview -->
    <div class="wbm-content">
        <section class="wbm-toolbar wbm-bar" id="wbm-toolbar" role="region" aria-label="Toolbar">
            <div class="wbm-toolbar__group">
                <button class="wbm-icon-button wbm-show-sidebar" id="wbm-show-sidebar" type="button"
                        aria-label="Show sidebar" title="Show sidebar">
                    <svg class="wbm-icon"><use href="#wbm-icon-menu"/></svg>
                </button>
                <button class="wbm-icon-button" id="wbm-reload" type="button" aria-label="Reload story"
                        title="Reload story">
                    <svg class="wbm-icon"><use href="#wbm-icon-reload"/></svg>
                </button>
                <button class="wbm-icon-button" id="wbm-measure" type="button" role="switch"
                        aria-label="Measure tool" title="Measure tool">
                    <svg class="wbm-icon"><use href="#wbm-icon-ruler"/></svg>
                </button>
                <button class="wbm-icon-button" id="wbm-outline" type="button" role="switch"
                        aria-label="Outline tool" title="Outline tool">
                    <svg class="wbm-icon"><use href="#wbm-icon-outline"/></svg>
                </button>
                <button class="wbm-icon-button" id="wbm-viewport-button" type="button" aria-label="Viewport size"
                        aria-haspopup="listbox" title="Viewport size">
                    <svg class="wbm-icon"><use href="#wbm-icon-viewport"/></svg>
                    <span class="wbm-tool-label" id="wbm-viewport-label"></span>
                </button>
                <button class="wbm-icon-button" id="wbm-vision-button" type="button" aria-label="Vision filter"
                        aria-haspopup="listbox" title="Vision filter">
                    <svg class="wbm-icon"><use href="#wbm-icon-accessibility"/></svg>
                    <span class="wbm-tool-label" id="wbm-vision-label"></span>
                </button>
            </div>
            <div class="wbm-toolbar__group">
                <button class="wbm-icon-button" id="wbm-isolation" type="button"
                        aria-label="Open in isolation mode" title="Open in isolation mode">
                    <svg class="wbm-icon"><use href="#wbm-icon-share"/></svg>
                </button>
                <button class="wbm-icon-button wbm-zoom" id="wbm-zoom" type="button" role="switch"
                        aria-haspopup="dialog" aria-label="Change zoom level" title="Change zoom level">100%</button>
                <button class="wbm-icon-button" id="wbm-fullscreen" type="button" aria-label="Enter full screen"
                        title="Enter full screen">
                    <svg class="wbm-icon"><use href="#wbm-icon-fullscreen"/></svg>
                </button>
                <button class="wbm-icon-button wbm-show-panel" id="wbm-show-panel" type="button"
                        aria-label="Show addon panel" title="Show addon panel">
                    <svg class="wbm-icon"><use href="#wbm-icon-panel-bottom"/></svg>
                </button>
                <button class="wbm-icon-button" id="wbm-open-in-editor" type="button" aria-label="Open in editor"
                        title="Open in editor">
                    <svg class="wbm-icon"><use href="#wbm-icon-editor"/></svg>
                </button>
            </div>
        </section>
        <main class="wbm-preview" id="workbench-preview-wrapper">
            <!-- Only shown when a viewport size is selected -->
            <div class="wbm-viewport-controls" id="wbm-viewport-controls">
                <label class="wbm-size-input">
                    <span class="wbm-size-input__prefix" aria-hidden="true">W</span>
                    <input id="wbm-viewport-width" aria-label="Viewport width" data-size-input="width"
                           spellcheck="false" autocomplete="off"/>
                </label>
                <button class="wbm-icon-button" id="wbm-viewport-rotate" type="button" aria-label="Rotate viewport"
                        title="Rotate viewport">
                    <svg class="wbm-icon"><use href="#wbm-icon-transfer"/></svg>
                </button>
                <label class="wbm-size-input">
                    <span class="wbm-size-input__prefix" aria-hidden="true">H</span>
                    <input id="wbm-viewport-height" aria-label="Viewport height" data-size-input="height"
                           spellcheck="false" autocomplete="off"/>
                </label>
            </div>
            <div class="wbm-viewport-frame" id="wbm-viewport-frame">
                <div class="wbm-zoom-wrapper" id="wbm-zoom-wrapper">
                    <iframe id="workbench-preview-iframe" title="workbench-preview-iframe"
                            allow="clipboard-write;"></iframe>
                </div>
                <div class="wbm-viewport-handle wbm-viewport-handle--right" data-side="right"></div>
                <div class="wbm-viewport-handle wbm-viewport-handle--bottom" data-side="bottom"></div>
                <div class="wbm-viewport-handle wbm-viewport-handle--both" data-side="both"></div>
            </div>
        </main>
    </div>

    <!-- Addon panel -->
    <aside class="wbm-panel" id="workbench-panel-root" role="region" aria-label="Addon panel">
        <div class="wbm-resizer wbm-resizer--panel" id="wbm-panel-resizer" role="separator"
             aria-label="Addon panel resize handle"></div>
        <div class="wbm-panel__bar wbm-bar">
            <div class="wbm-panel__tabs" id="wbm-panel-tabs" role="tablist" aria-label="Available addons"></div>
            <div class="wbm-panel__actions">
                <button class="wbm-icon-button" id="wbm-panel-position" type="button"
                        aria-label="Move addon panel to right" title="Move addon panel to right">
                    <svg class="wbm-icon"><use href="#wbm-icon-panel-right"/></svg>
                </button>
                <button class="wbm-icon-button" id="wbm-panel-hide" type="button" aria-label="Hide addon panel"
                        title="Hide addon panel">
                    <svg class="wbm-icon"><use href="#wbm-icon-close-panel"/></svg>
                </button>
            </div>
        </div>
        <div class="wbm-panel__content" id="wbm-panel-content" role="tabpanel"></div>
    </aside>

    <!-- Settings pages, shown in place of the preview and addon panel -->
    <div class="wbm-settings" id="wbm-settings" role="main">
        <div class="wbm-settings__bar wbm-bar">
            <div class="wbm-settings__tabs" id="wbm-settings-tabs" role="tablist"></div>
            <button class="wbm-icon-button" id="wbm-settings-close" type="button"
                    aria-label="Close settings page" title="Close settings page">
                <svg class="wbm-icon"><use href="#wbm-icon-close-panel"/></svg>
            </button>
        </div>
        <div class="wbm-settings__content" id="wbm-settings-content"></div>
    </div>
</div>
