// The workbench framework: a React Storybook look-alike, as the GWT module
// stroom.gwt.workbench.framework.WorkbenchFramework, plus a static file server to serve it.
//
// It deliberately has no Stroom dependencies. The stories, and the tasks to compile and
// serve them, are in stroom-gwt-workbench.

ext.moduleName = 'stroom.gwt.workbench.framework'

dependencies {
    implementation libs.gwt.user

    // Used by the static file server
    implementation libs.slf4j.api
    runtimeOnly libs.logback.classic

    testImplementation libs.bundles.common.test.implementation
    testRuntimeOnly libs.bundles.common.test.runtime
}
