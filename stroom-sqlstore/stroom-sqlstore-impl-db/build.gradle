ext.moduleName = 'stroom.sqlstore.impl.db'

dependencies {
    implementation project(':stroom-sqlstore:stroom-sqlstore-api')
    implementation project(':stroom-sqlstore:stroom-sqlstore-shared')
    implementation project(':stroom-sqlstore:stroom-sqlstore-impl')
    implementation project(':stroom-sqlstore:stroom-sqlstore-impl-db-jooq')
    implementation project(':stroom-config:stroom-config-common')
    implementation project(':stroom-core-shared')
    implementation project(':stroom-db-util')
    implementation project(':stroom-query:stroom-query-api')
    implementation project(':stroom-util')
    implementation project(':stroom-util-shared')

    implementation libs.flyway.core
    implementation libs.flyway.mysql
    implementation libs.guice
    implementation libs.jakarta.inject
    implementation libs.jooq
    implementation libs.slf4j.api

    runtimeOnly libs.mysql.connector.java

    testImplementation project(':stroom-test-common')
    testImplementation project(':stroom-security:stroom-security-api')
    testImplementation project(':stroom-security:stroom-security-mock')
    testImplementation project(':stroom-dictionary:stroom-dictionary-api')
    testImplementation project(':stroom-explorer:stroom-collection-api')
    testImplementation project(':stroom-docstore:stroom-docstore-api')

    // Behaviour-parity test against the Plan B temporal state store. Test scope only - nothing in
    // the SQL store's production code knows Plan B exists, and it must stay that way.
    testImplementation project(':stroom-planb:stroom-planb-impl')
    testImplementation project(':stroom-bytebuffer')
    testImplementation project(':stroom-query:stroom-query-common')
    testImplementation project(':stroom-query:stroom-query-language')
    testImplementation project(':stroom-docref')
    testImplementation project(':stroom-lmdb')

    testImplementation libs.bundles.common.test.implementation
    testRuntimeOnly libs.bundles.common.test.runtime
}
