import java.time.ZonedDateTime
import java.time.format.DateTimeFormatter

ext.moduleName = 'stroom.util'

dependencies {
    implementation project(':stroom-docref')
    implementation project(':stroom-util-shared')

    implementation libs.assertj.core // needed for DiffUtil
    implementation libs.commons.compress
    implementation libs.commons.csv
    implementation libs.dropwizard.client
    implementation libs.guice
    implementation libs.jackson.annotations
    implementation libs.jackson.dataformat.yaml
    implementation libs.jaxb.api
    implementation libs.quartz
    implementation libs.saxon.he
    implementation libs.xerces

    testImplementation project(':stroom-test-common')
    testImplementation libs.jmh.generator.annprocess
    testImplementation libs.vavr

    testImplementation libs.bundles.common.test.implementation
    testRuntimeOnly libs.bundles.common.test.runtime
}

// Read by BuildInfoProvider. buildDate changes on every build, so the root build.gradle
// tells gradle to ignore it when deciding if tests need to run again.
def buildInfoDir = layout.buildDirectory.dir('generated/resources/buildInfo')
def buildPropertiesPath = 'META-INF/stroom-util-build.properties'

def writeBuildProperties = tasks.register('writeBuildProperties', WriteProperties) {
    destinationFile = buildInfoDir.map { it.file(buildPropertiesPath) }
    property 'buildVersion', versions.stroom
    property 'buildDate', ZonedDateTime.now().format(DateTimeFormatter.ISO_INSTANT)

    // Older builds wrote this file into src, which would now be a duplicate of the
    // generated one, so remove it if a build on an older branch has left it there
    doFirst {
        delete file("src/main/resources/${buildPropertiesPath}")
    }
}

// Makes the generated file part of the jar and classpath, and makes
// processResources depend on writeBuildProperties
sourceSets.main.resources.srcDir(files(buildInfoDir).builtBy(writeBuildProperties))
