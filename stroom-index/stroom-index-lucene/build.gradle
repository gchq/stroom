ext.moduleName = 'stroom.index.lucene'

dependencies {
    implementation project(':stroom-ai:stroom-ai-api')
    implementation project(':stroom-cluster:stroom-cluster-lock-api')
    implementation project(':stroom-cluster:stroom-cluster-api')
    implementation project(':stroom-config:stroom-config-common')
    implementation project(':stroom-core-shared')
    implementation project(':stroom-dictionary:stroom-dictionary-api')
    implementation project(':stroom-docref')
    implementation project(':stroom-docstore:stroom-docstore-api')
    implementation project(':stroom-explorer:stroom-explorer-api')
    implementation project(':stroom-index:stroom-index-impl')
    implementation project(':stroom-importexport:stroom-importexport-api')
    implementation project(':stroom-job:stroom-job-api')
    implementation project(':stroom-meta:stroom-meta-api')
    implementation project(':stroom-node:stroom-node-api')
    implementation project(':stroom-query:stroom-query-api')
    implementation project(':stroom-query:stroom-query-common')
    implementation project(':stroom-query:stroom-query-language')
    implementation project(':stroom-search:stroom-search-extraction')
    implementation project(':stroom-search:stroom-search-impl')
    implementation project(':stroom-security:stroom-security-api')
    implementation project(':stroom-task:stroom-task-api')
    implementation project(':stroom-util')
    implementation project(':stroom-util-shared')

    // All these pull in lucene-core transitively.
    // lucene-analyzers-common was renamed to lucene-analysis-common in v9.0.0
    implementation "org.apache.lucene:lucene-analysis-common:10.3.2"
    implementation "org.apache.lucene:lucene-memory:10.3.2"
    implementation "org.apache.lucene:lucene-queryparser:10.3.2"
    implementation "org.apache.lucene:lucene-highlighter:10.3.2"

    // Needed to read shards written by older versions, e.g. 9.8.0
    runtimeOnly "org.apache.lucene:lucene-backward-codecs:10.3.2"

    implementation libs.jackson.databind
    implementation libs.guice
    implementation libs.jackson.annotations
    implementation libs.langchain4j
    implementation libs.vavr

    testImplementation project(':stroom-test-common')

    testImplementation libs.bundles.common.test.implementation
    testRuntimeOnly libs.bundles.common.test.runtime
}
