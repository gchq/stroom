name: Validate Pull Requests
on:
  # WARNGING!!: Make sure you understand the implications of 'pull_request_target'.
  # This runs with secrets and write perms against the trusted base branch, not the fork.
  # See https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
  pull_request_target:

permissions:
  # We need to do the following:
  # - Read the files that are in the PR
  # - Close the PR (with a comment) if the author is not a collaborator, member or owner
  pull-requests: write

jobs:
  check_pr_job:
    runs-on: ubuntu-slim
    steps:

      - name: Close PRs from non-collaborators
        id: check_author_association
        if: ${{ !contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.pull_request.author_association) }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          echo "PR: ${PR}, author: ${AUTHOR}, author_association: ${AUTHOR_ASSOCIATION}"
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY" \
          --comment "This repository only accepts pull requests from organisation members or approved outside collaborators. This pull request has been closed automatically."
          
          echo "::error::PR closed as author is not a collaborator."
          exit 1


      - name: Check if author is a member of the "Stroom Administrators" org level team
        id: check_team
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "$response_file" "$error_file"' EXIT

          if gh api --include --silent \
              "orgs/gchq/teams/stroom-administrators/memberships/${AUTHOR}" \
              >"${response_file}" 2>"${error_file}"; then
            api_exit_code=0
          else
            api_exit_code=$?
          fi

          http_status_code="$(
            awk '$1 ~ /^HTTP\// { status = $2 } END { print status }' \
              "${response_file}"
          )"
          
          echo "api_exit_code: ${api_exit_code}, http_status_code: ${http_status_code}"

          case "${http_status_code}" in
            2*)
              # The author is a member of "Stroom Administrators" team, so skip next step
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              # The author is not a team member, so continue with next step
              echo "skip=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              # Something went wrong
              echo "::error::Unable to determine team membership."
              echo "gh exited with status ${api_exit_code}"
              cat "${error_file}"
              exit 1
              ;;
          esac


      - name: Look for changes to CI related files
        # Don't run if we are a member of "Stroom Administrators" team
        if: steps.check_team.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          # List all the files in the PR.
          # Check both the current and previous filenames to allow for renames.
          # If any file matches a pattern then exit with an error to indicate 
          # that the PR should be rejected or checked with greater caution.
          
          for json_field in filename previous_filename; do
            files=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq ".[].${json_field}")

            if [ -n "${files}" ]; then
              file_count=$(echo "${files}" | wc -l)
              echo "Found $file_count file(s) for field ${json_field}"

              if echo "$files" | grep -Eq '^\.github/'; then
                echo "::error::This PR modifies GH Workflow related files."
                exit 1
              fi

              if echo "$files" | grep -Eq '^container_build/'; then
                echo "::error::This PR modifies container_build files."
                exit 1
              fi

              if echo "$files" | grep -Eq '^(ci_)?build.*\.sh$'; then
                echo "::error::This PR modifies build scripts."
                exit 1
              fi

            fi
          done
