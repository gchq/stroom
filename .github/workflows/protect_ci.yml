name: Flag CI changes
on:
  # Runs against the target of the PR
  pull_request_target:

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:

      - name: Check if author is a maintainer
        id: team
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if gh api "orgs/gchq/teams/stroom-administrators/memberships/$AUTHOR" --silent 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for .github changes
        # Don't run if we are a member of stroom-administrators
        if: steps.team.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          for json_field in filename previous_filename; do
            files=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq ".[].${json_field}")

            if [ -n "${files}" ]; then
              file_count=$(echo "${files}" | wc -l)
              echo "Found $file_count file(s) for field ${json_field}"

              if echo "$files" | grep -Eq '^\.github/'; then
                echo "::error::This PR modifies GH Workflow related files."
                exit 1
              fi

              if echo "$files" | grep -Eq '^container_build/'; then
                echo "::error::This PR modifies container_build files."
                exit 1
              fi

              if echo "$files" | grep -Eq '^(ci_)?build.*\.sh$'; then
                echo "::error::This PR modifies build scripts."
                exit 1
              fi

            fi
          done
